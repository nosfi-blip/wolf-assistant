<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Джем — Голосовой чиби-волчонок</title>
  <style>
    :root {
      --bg: #0e121a;
      --card-bg: #161c28;
      --accent: #7aa2f7;
      --accent-glow: rgba(122, 162, 247, 0.45);
      --text: #c0caf5;
      --text-dim: #7982a9;
      --border: #232b3e;
      --active-btn: #41a6b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-image: radial-gradient(circle at 50% 25%, #1a2235 0%, #0e121a 80%);
    }

    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background-color: rgba(22, 28, 40, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.15rem;
      color: #fff;
    }

    .brand-tag {
      font-size: 0.65rem;
      background: linear-gradient(135deg, #bb9af7, #7aa2f7);
      color: #0e121a;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .auto-toggle {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s;
    }

    .auto-toggle.active {
      background: var(--active-btn);
      color: #fff;
      border-color: var(--active-btn);
      box-shadow: 0 0 12px rgba(65, 166, 181, 0.5);
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
    }

    .character-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      position: relative;
    }

    .mascot-box {
      width: 270px;
      height: 330px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg#jam-wolf {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.6));
      transform-origin: bottom center;
    }

    /* Анимации состояний */
    .idle svg#jam-wolf {
      animation: jamBreathe 3.5s ease-in-out infinite alternate;
    }
    @keyframes jamBreathe {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-5px) scale(1.015); }
    }

    /* Слушает */
    .listening #ear-left {
      animation: earWiggle 0.5s ease-in-out infinite alternate;
    }
    @keyframes earWiggle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-5deg); }
    }

    /* Моргание */
    .eye-round {
      transform-origin: center;
      transition: transform 0.12s ease;
    }
    .blinking .eye-round {
      transform: scaleY(0.08);
    }

    /* Говорит */
    .speaking svg#jam-wolf {
      animation: jamTalkBounce 0.25s ease-in-out infinite alternate;
    }
    .speaking #mouth-open-path {
      display: block !important;
      animation: mouthStretch 0.22s ease-in-out infinite alternate;
      transform-origin: top center;
    }
    .speaking #mouth-closed-path {
      display: none !important;
    }
    @keyframes jamTalkBounce {
      0% { transform: scale(1); }
      100% { transform: scale(1.02) translateY(-3px); }
    }
    @keyframes mouthStretch {
      0% { transform: scaleY(0.3) scaleX(0.9); }
      100% { transform: scaleY(1.3) scaleX(1.1); }
    }

    /* Сон */
    .sleeping .eye-round {
      display: none;
    }
    .sleeping .eye-sleep {
      display: block !important;
    }
    .sleeping svg#jam-wolf {
      animation: jamSleep 3s ease-in-out infinite alternate;
    }
    @keyframes jamSleep {
      0% { transform: translateY(3px) rotate(1deg); }
      100% { transform: translateY(8px) rotate(-1deg); }
    }

    /* Еда (сэндвич) */
    .eating #jam-sandwich {
      display: block !important;
      animation: chewSandwich 0.35s ease-in-out infinite alternate;
      transform-origin: center;
    }
    @keyframes chewSandwich {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-4px) rotate(3deg); }
    }

    /* Танец */
    .dancing svg#jam-wolf {
      animation: jamDance 0.5s ease-in-out infinite alternate;
    }
    #jam-tail {
      transform-origin: 195px 235px;
      animation: tailWag 2.5s ease-in-out infinite alternate;
    }
    .dancing #jam-tail {
      animation: tailWagFast 0.4s ease-in-out infinite alternate;
    }
    @keyframes jamDance {
      0% { transform: rotate(-5deg) translateY(-8px); }
      100% { transform: rotate(5deg) translateY(0); }
    }
    @keyframes tailWag {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(6deg); }
    }
    @keyframes tailWagFast {
      0% { transform: rotate(-12deg); }
      100% { transform: rotate(12deg); }
    }

    /* Текст статуса и бабл */
    .status-text {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 10px;
      height: 18px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 700;
      text-align: center;
    }

    .chat-bubble {
      margin-top: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 18px;
      max-width: 90%;
      min-height: 48px;
      max-height: 130px;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(22, 28, 40, 0.9);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
      gap: 12px;
      z-index: 10;
    }

    .mic-button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7aa2f7, #6088ff);
      border: none;
      color: #0e121a;
      font-size: 1.85rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 20px var(--accent-glow);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mic-button.active {
      background: linear-gradient(135deg, #f7768e, #ff4065);
      box-shadow: 0 0 25px rgba(247, 118, 142, 0.8);
      transform: scale(1.1);
      animation: pulseGlow 1.2s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(247, 118, 142, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(247, 118, 142, 0); }
      100% { box-shadow: 0 0 0 0 rgba(247, 118, 142, 0); }
    }

    .mic-hint {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* Модальное окно настроек */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #0e121a;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-wrap input[type="range"] {
      flex: 1;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .btn-save { background: var(--accent); color: #0e121a; }
    .btn-test { background: rgba(255,255,255,0.08); color: #fff; }
    .btn-close { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Джем</span>
      <span class="brand-tag">Gemini 3.6</span>
    </div>
    <div class="header-actions">
      <button class="auto-toggle" id="autoModeBtn" onclick="toggleAutoMode()">
        <span>Авто-голос</span>
      </button>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
  </header>

  <main class="character-stage">
    <div class="mascot-box idle" id="mascotBox">
      <!-- Новый векторный Джем: пушистый контурный чиби по твоему 2D-арту -->
      <svg id="jam-wolf" viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="geminiGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- Пушистый хвост сбоку -->
        <g id="jam-tail">
          <path d="M 190 240 C 235 240 265 210 255 180 C 248 198 230 205 215 200 C 218 215 205 230 185 235 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 255 180 C 248 198 230 205 215 200 C 228 185 242 180 255 180 Z" fill="#ffffff" stroke="#363d4e" stroke-width="4"/>
        </g>

        <!-- Задние короткие лапки в белых носочках -->
        <g id="jam-feet">
          <rect x="105" y="275" width="34" height="28" rx="14" fill="#ffffff" stroke="#363d4e" stroke-width="5"/>
          <path d="M 116 288 L 116 298 M 128 288 L 128 298" stroke="#363d4e" stroke-width="3" stroke-linecap="round"/>

          <rect x="160" y="275" width="34" height="28" rx="14" fill="#ffffff" stroke="#363d4e" stroke-width="5"/>
          <path d="M 171 288 L 171 298 M 183 288 L 183 298" stroke="#363d4e" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Черная оверсайз-футболка -->
        <g id="jam-shirt">
          <path d="M 90 205 Q 150 215 210 205 L 218 280 Q 150 290 82 280 Z" fill="#1c2029" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <!-- Рукава -->
          <path d="M 95 208 L 65 235 L 82 250 L 102 225 Z" fill="#1c2029" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 205 208 L 235 235 L 218 250 L 198 225 Z" fill="#1c2029" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <!-- Белые круглые передние лапки -->
          <circle cx="68" cy="242" r="12" fill="#ffffff" stroke="#363d4e" stroke-width="4"/>
          <circle cx="232" cy="242" r="12" fill="#ffffff" stroke="#363d4e" stroke-width="4"/>

          <!-- Неоновый символ Gemini -->
          <g filter="url(#geminiGlow)">
            <path d="M 140 236 L 160 236 M 143 256 L 163 256 M 148 232 L 143 260 M 155 232 L 160 260" stroke="#a5b4fc" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="140" cy="236" r="2.2" fill="#ffffff"/>
            <circle cx="160" cy="236" r="2.2" fill="#ffffff"/>
            <circle cx="143" cy="256" r="2.2" fill="#ffffff"/>
            <circle cx="163" cy="256" r="2.2" fill="#ffffff"/>
          </g>
        </g>

        <!-- Левое ухо -->
        <g id="ear-left" style="transform-origin: 90px 115px;">
          <path d="M 72 115 C 50 70 70 18 102 38 C 115 70 108 105 98 118 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 78 105 C 64 74 76 38 98 52 C 105 72 100 96 94 106 Z" fill="#5a6273"/>
          <path d="M 83 98 C 73 76 82 52 96 62 C 100 76 96 92 92 99 Z" fill="#fca5a5"/>
        </g>

        <!-- Правое ухо -->
        <g id="ear-right" style="transform-origin: 210px 115px;">
          <path d="M 228 115 C 250 70 230 18 198 38 C 185 70 192 105 202 118 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 222 105 C 236 74 224 38 202 52 C 195 72 200 96 206 106 Z" fill="#5a6273"/>
          <path d="M 217 98 C 227 76 218 52 204 62 C 200 76 204 92 208 99 Z" fill="#fca5a5"/>
        </g>

        <!-- Пушистая голова с острыми щечками -->
        <path d="M 80 130 C 52 140 50 160 70 170 C 50 178 54 200 80 198 C 95 218 205 218 220 198 C 246 200 250 178 230 170 C 250 160 248 140 220 130 C 225 80 75 80 80 130 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>

        <!-- Светлая маска-мордочка в форме сердечка -->
        <path d="M 98 145 C 80 165 90 195 120 195 C 135 195 145 186 150 182 C 155 186 165 195 180 195 C 210 195 220 165 202 145 C 190 130 160 135 150 148 C 140 135 110 130 98 145 Z" fill="#ffffff" stroke="#363d4e" stroke-width="4"/>

        <!-- Фирменный пышный чубчик-завиток на макушке -->
        <path d="M 135 78 C 120 62 140 38 160 45 C 172 50 170 65 158 68 C 168 64 175 72 165 82 C 152 86 142 84 135 78 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="4.5" stroke-linejoin="round"/>

        <!-- Румянец штрихами на щечках -->
        <g stroke="#f87171" stroke-width="3" stroke-linecap="round">
          <line x1="96" y1="172" x2="102" y2="180" />
          <line x1="104" y1="172" x2="110" y2="180" />
          <line x1="190" y1="172" x2="196" y2="180" />
          <line x1="198" y1="172" x2="204" y2="180" />
        </g>

        <!-- Бровки -->
        <ellipse cx="118" cy="126" rx="6" ry="3.5" fill="#788194"/>
        <ellipse cx="182" cy="126" rx="6" ry="3.5" fill="#788194"/>

        <!-- Большие круглые сияющие глаза -->
        <g id="jam-eyes">
          <!-- Левый глаз -->
          <g class="eye-round">
            <ellipse cx="118" cy="148" rx="14" ry="17" fill="#181a20"/>
            <circle cx="114" cy="142" r="6" fill="#ffffff"/>
            <circle cx="123" cy="156" r="2.8" fill="#ffffff"/>
          </g>
          <!-- Спящий левый глаз (дуга) -->
          <path class="eye-sleep" d="M 106 150 Q 118 162 130 150" stroke="#181a20" stroke-width="4.5" stroke-linecap="round" fill="none" style="display: none;"/>

          <!-- Правый глаз -->
          <g class="eye-round">
            <ellipse cx="182" cy="148" rx="14" ry="17" fill="#181a20"/>
            <circle cx="178" cy="142" r="6" fill="#ffffff"/>
            <circle cx="187" cy="156" r="2.8" fill="#ffffff"/>
          </g>
          <!-- Спящий правый глаз (дуга) -->
          <path class="eye-sleep" d="M 170 150 Q 182 162 194 150" stroke="#181a20" stroke-width="4.5" stroke-linecap="round" fill="none" style="display: none;"/>
        </g>

        <!-- Носик -->
        <ellipse cx="150" cy="165" rx="8" ry="6.5" fill="#1e222b"/>

        <!-- Довольный ротик "омега" (закрытый) -->
        <path id="mouth-closed-path" d="M 140 172 Q 145 178 150 173 Q 155 178 160 172" stroke="#1e222b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

        <!-- Открывающийся ротик при разговоре -->
        <path id="mouth-open-path" d="M 140 172 Q 150 190 160 172 Z" fill="#e11d48" stroke="#1e222b" stroke-width="3" style="display: none;"/>

        <!-- Сэндвич (появляется при бездействии) -->
        <g id="jam-sandwich" style="display: none;">
          <polygon points="130,225 170,225 150,200" fill="#fde047" stroke="#363d4e" stroke-width="3"/>
          <line x1="134" y1="223" x2="166" y2="223" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
          <line x1="138" y1="219" x2="162" y2="219" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <div class="status-text" id="statusText">Привет! Я Джем 🐾</div>
    <div class="chat-bubble" id="chatBubble">Нажми на микрофон, чтобы поговорить со мной!</div>
  </main>

  <footer class="controls">
    <button class="mic-button" id="micBtn" onclick="handleMicClick()">🎤</button>
    <div class="mic-hint" id="micHint">Нажми и говори</div>
  </footer>

  <!-- Настройки -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Настройки Джема</h2>

      <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="apiKeyInput" class="form-control" placeholder="Вставьте ваш API-ключ">
      </div>

      <div class="form-group">
        <label>Голос озвучки (Онлайн Нейросеть / Системный):</label>
        <select id="voiceSelect" class="form-control">
          <option value="neural_female">Онлайн: Светлана (Нейросеть, мягкий)</option>
          <option value="neural_male">Онлайн: Дмитрий (Нейросеть, живой)</option>
          <option value="system">Системный синтезатор телефона</option>
        </select>
      </div>

      <div class="form-group">
        <label>Высота голоса (тональность чиби): <span id="pitchVal">1.15</span></label>
        <div class="range-wrap">
          <input type="range" id="pitchInput" min="0.8" max="1.6" step="0.05" value="1.15" oninput="updatePitchVal(this.value)">
        </div>
      </div>

      <div class="form-group">
        <label>Скорость речи: <span id="rateVal">1.0</span></label>
        <div class="range-wrap">
          <input type="range" id="rateInput" min="0.8" max="1.3" step="0.05" value="1.0" oninput="updateRateVal(this.value)">
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-test" onclick="testVoice()">Тест голоса</button>
        <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
        <button class="btn btn-close" onclick="closeSettings()">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    let isListening = false;
    let autoMode = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let audioPlayer = new Audio();
    
    // Таймер скуки
    let idleSeconds = 0;
    let idleTimer = null;

    const mascotBox = document.getElementById('mascotBox');
    const statusText = document.getElementById('statusText');
    const chatBubble = document.getElementById('chatBubble');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const autoModeBtn = document.getElementById('autoModeBtn');

    // 1. Анимация моргания
    setInterval(() => {
      if (mascotBox.classList.contains('idle')) {
        mascotBox.classList.add('blinking');
        setTimeout(() => mascotBox.classList.remove('blinking'), 150);
      }
    }, 3800);

    // 2. Трекер бездействия
    function resetIdleTimer() {
      idleSeconds = 0;
      if (!mascotBox.classList.contains('speaking') && 
          !mascotBox.classList.contains('listening') && 
          !mascotBox.classList.contains('thinking')) {
        setMascotState('idle', 'Джем ждёт 🐾');
      }
    }

    function startIdleTracker() {
      clearInterval(idleTimer);
      idleTimer = setInterval(() => {
        if (isListening || (synth && synth.speaking) || !audioPlayer.paused || mascotBox.classList.contains('thinking')) {
          idleSeconds = 0;
          return;
        }

        idleSeconds++;

        if (idleSeconds === 12) {
          setMascotState('idle', 'Джем скучает...');
        } else if (idleSeconds === 22) {
          setMascotState('eating', 'Джем жуёт сэндвич 🥪');
          chatBubble.innerText = '*хрум-хрум* Вкуснятина!';
        } else if (idleSeconds === 45) {
          setMascotState('dancing', 'Джем танцует ✨🐾');
          chatBubble.innerText = 'Лапками топ-топ! Танцуем!';
        } else if (idleSeconds === 75) {
          setMascotState('sleeping', 'Джем сладко спит... 💤');
          chatBubble.innerText = 'Zzz... Снится сахарная косточка...';
        }
      }, 1000);
    }
    startIdleTracker();

    function setMascotState(stateClass, label) {
      mascotBox.className = 'mascot-box ' + stateClass;
      statusText.innerText = label;
    }

    // 3. Загрузка сохраненных настроек
    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    const savedVoiceMode = localStorage.getItem('jam_voice_mode') || 'neural_female';
    document.getElementById('voiceSelect').value = savedVoiceMode;

    const savedPitch = localStorage.getItem('jam_pitch') || '1.15';
    const savedRate = localStorage.getItem('jam_rate') || '1.0';
    document.getElementById('pitchInput').value = savedPitch;
    document.getElementById('pitchVal').innerText = savedPitch;
    document.getElementById('rateInput').value = savedRate;
    document.getElementById('rateVal').innerText = savedRate;

    // 4. Микрофон и распознавание
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        resetIdleTimer();
        isListening = true;
        micBtn.classList.add('active');
        micHint.innerText = 'Слушаю тебя...';
        setMascotState('listening', 'Джем слушает ушком 🐾');
      };

      recognition.onresult = (e) => {
        resetIdleTimer();
        const text = e.results[0][0].transcript;
        chatBubble.innerText = 'Ты: ' + text;
        processUserQuery(text);
      };

      recognition.onerror = () => {
        stopListening();
        setMascotState('idle', 'Привет! Я Джем 🐾');
        micHint.innerText = 'Нажми и говори';
      };

      recognition.onend = () => {
        stopListening();
      };
    }

    function handleMicClick() {
      resetIdleTimer();
      if (!recognition) {
        alert('Открой сайт через Chrome на телефоне!');
        return;
      }
      if (synth && synth.speaking) synth.cancel();
      if (!audioPlayer.paused) audioPlayer.pause();

      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch(err) {
          console.log(err);
        }
      }
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('active');
    }

    // 5. Запрос к Gemini 3.6 Flash
    async function processUserQuery(query) {
      resetIdleTimer();
      setMascotState('thinking', 'Джем соображает...');
      const apiKey = localStorage.getItem('gemini_api_key');

      if (!apiKey) {
        setTimeout(() => {
          speakResponse("Я тебя отлично слышу! Но чтобы я стал умным чиби-волчонком, добавь свой ключик в шестерёнку наверху!");
        }, 800);
        return;
      }

      try {
        const prompt = `Ты — Джем, маленький чиби-волчонок в черной футболке с эмблемой Gemini. У тебя пушистые щечки, большие круглые глаза и озорной характер. Отвечай дружелюбно, весело, без официоза, кратко (1-2 емких предложения максимум). Вопрос: ${query}`;
        
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          speakResponse("Ой! Ошибка Gemini: " + (data.error.message || "проверь ключ"));
          return;
        }

        if (data.candidates && data.candidates[0] && data.candidates[0].content) {
          const reply = data.candidates[0].content.parts[0].text;
          speakResponse(reply);
        } else {
          speakResponse("Не удалось разобрать ответ от космоса.");
        }
      } catch (err) {
        speakResponse("Не могу связаться с Gemini. Проверь сеть или VPN!");
      }
    }

    // 6. Озвучка ответа (Нейросетевая онлайн или системная)
    function speakResponse(text) {
      resetIdleTimer();
      chatBubble.innerText = text;
      setMascotState('speaking', 'Джем говорит...');

      const voiceMode = localStorage.getItem('jam_voice_mode') || 'neural_female';

      if (voiceMode.startsWith('neural')) {
        // Онлайн нейросетевая озвучка через шлюз Edge TTS
        const voiceName = voiceMode === 'neural_female' ? 'ru-RU-SvetlanaNeural' : 'ru-RU-DmitryNeural';
        const encodedText = encodeURIComponent(text);
        const ttsUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voiceName}&text=${encodedText}`;

        audioPlayer.src = ttsUrl;
        audioPlayer.playbackRate = parseFloat(localStorage.getItem('jam_rate') || '1.0');

        audioPlayer.onended = () => {
          setMascotState('idle', 'Привет! Я Джем 🐾');
          resetIdleTimer();
          checkAutoMode();
        };

        audioPlayer.onerror = () => {
          // Если онлайн-сеть недоступна, запасной вариант — системный синтез
          fallbackSystemSpeak(text);
        };

        audioPlayer.play().catch(() => fallbackSystemSpeak(text));
      } else {
        fallbackSystemSpeak(text);
      }
    }

    function fallbackSystemSpeak(text) {
      if (!synth) {
        setMascotState('idle', 'Джем 🐾');
        return;
      }
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.pitch = parseFloat(localStorage.getItem('jam_pitch') || '1.15');
      utterance.rate = parseFloat(localStorage.getItem('jam_rate') || '1.0');

      utterance.onend = () => {
        setMascotState('idle', 'Привет! Я Джем 🐾');
        resetIdleTimer();
        checkAutoMode();
      };
      utterance.onerror = () => setMascotState('idle', 'Привет! Я Джем 🐾');
      synth.speak(utterance);
    }

    function checkAutoMode() {
      if (autoMode) {
        setTimeout(() => {
          if (recognition && !isListening) {
            try { recognition.start(); } catch(e){}
          }
        }, 600);
      }
    }

    function toggleAutoMode() {
      resetIdleTimer();
      autoMode = !autoMode;
      if (autoMode) {
        autoModeBtn.classList.add('active');
        if (!isListening && (!synth || !synth.speaking) && audioPlayer.paused) {
          handleMicClick();
        }
      } else {
        autoModeBtn.classList.remove('active');
      }
    }

    // Настройки
    function openSettings() {
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function updatePitchVal(v) {
      document.getElementById('pitchVal').innerText = v;
    }

    function updateRateVal(v) {
      document.getElementById('rateVal').innerText = v;
    }

    function testVoice() {
      speakResponse("Привет! Я чиби-волчонок Джем, проверяю свой новый голосок!");
    }

    function saveSettings() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const voiceMode = document.getElementById('voiceSelect').value;
      const pitch = document.getElementById('pitchInput').value;
      const rate = document.getElementById('rateInput').value;

      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('jam_voice_mode', voiceMode);
      localStorage.setItem('jam_pitch', pitch);
      localStorage.setItem('jam_rate', rate);

      closeSettings();
      resetIdleTimer();
      alert('Настройки сохранены!');
    }
  </script>
</body>
  </html>
