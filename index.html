<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Джем — Голосовой чиби-волчонок</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #141b26;
      --accent: #82aaff;
      --accent-glow: rgba(130, 170, 255, 0.45);
      --text: #e6edf3;
      --text-dim: #8b949e;
      --border: #263346;
      --active-btn: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-image: radial-gradient(circle at 50% 30%, #172236 0%, #0b0f17 80%);
    }

    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background-color: rgba(20, 27, 38, 0.85);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-tag {
      font-size: 0.65rem;
      background: linear-gradient(135deg, #a78bfa, #82aaff);
      color: #0b0f17;
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .auto-toggle {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s;
    }

    .auto-toggle.active {
      background: var(--active-btn);
      color: #fff;
      border-color: var(--active-btn);
      box-shadow: 0 0 12px rgba(46, 160, 67, 0.5);
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
    }

    .character-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      position: relative;
    }

    /* Контейнер персонажа */
    .mascot-container {
      width: 250px;
      height: 330px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .wolf-base-art {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.65));
      pointer-events: none;
      user-select: none;
    }

    /* Анимированные накладки на лицо и тело */
    .face-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Интерактивные оверлеи эмоций */
    .overlay-item {
      position: absolute;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    /* Спящие глазки */
    .sleep-eyes {
      top: 29.5%;
      left: 31%;
      width: 38%;
      height: 6%;
      display: flex;
      justify-content: space-between;
    }
    .sleep-arc {
      width: 36px;
      height: 18px;
      border-bottom: 4px solid #1a1e24;
      border-radius: 0 0 20px 20px;
    }

    /* Открывающийся ротик */
    .talking-mouth {
      top: 38.2%;
      left: 45.5%;
      width: 22px;
      height: 15px;
      background: #de4765;
      border-radius: 4px 4px 14px 14px;
      border: 2px solid #232025;
      transform-origin: top center;
    }

    /* Сэндвич */
    .sandwich-item {
      bottom: 44%;
      left: 42%;
      font-size: 38px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    }

    /* Облачко Zzz */
    .zzz-bubble {
      top: 14%;
      right: 12%;
      font-size: 26px;
      font-weight: 900;
      color: #82aaff;
      text-shadow: 0 0 10px rgba(130,170,255,0.7);
    }

    /* Музыкальные ноты для танца */
    .notes {
      top: 15%;
      left: 15%;
      font-size: 26px;
    }

    /* === Стили и ключевые кадры состояний === */

    /* 1. Покой (Дыхание) */
    .mascot-container.idle {
      animation: gentleBreathe 4s ease-in-out infinite alternate;
    }
    @keyframes gentleBreathe {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-5px) scale(1.015); }
    }

    /* 2. Слушает (Ушки и внимательный взгляд) */
    .mascot-container.listening {
      animation: alertTilt 0.8s ease-in-out infinite alternate;
    }
    @keyframes alertTilt {
      0% { transform: rotate(-2deg) translateY(-4px); }
      100% { transform: rotate(2deg) translateY(-6px); }
    }

    /* 3. Говорит */
    .mascot-container.speaking {
      animation: talkBody 0.3s ease-in-out infinite alternate;
    }
    .mascot-container.speaking .talking-mouth {
      opacity: 1;
      animation: mouthMove 0.22s ease-in-out infinite alternate;
    }
    @keyframes mouthMove {
      0% { transform: scaleY(0.3) scaleX(0.85); }
      100% { transform: scaleY(1.3) scaleX(1.1); }
    }
    @keyframes talkBody {
      0% { transform: scale(1); }
      100% { transform: scale(1.02) translateY(-3px); }
    }

    /* 4. Жует сэндвич */
    .mascot-container.eating {
      animation: munchHead 0.4s ease-in-out infinite alternate;
    }
    .mascot-container.eating .sandwich-item {
      opacity: 1;
      animation: sandwichNibble 0.4s ease-in-out infinite alternate;
    }
    @keyframes munchHead {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
    @keyframes sandwichNibble {
      0% { transform: rotate(-4deg) scale(0.95); }
      100% { transform: rotate(4deg) scale(1.05); }
    }

    /* 5. Танцует */
    .mascot-container.dancing {
      animation: chibiDance 0.5s ease-in-out infinite alternate;
    }
    .mascot-container.dancing .notes {
      opacity: 1;
      animation: floatNotes 1s ease-in-out infinite alternate;
    }
    @keyframes chibiDance {
      0% { transform: rotate(-5deg) translateY(-8px); }
      100% { transform: rotate(5deg) translateY(0); }
    }
    @keyframes floatNotes {
      0% { transform: translateY(0) scale(0.9); }
      100% { transform: translateY(-10px) scale(1.15); }
    }

    /* 6. Спит */
    .mascot-container.sleeping {
      animation: sleepFloat 3s ease-in-out infinite alternate;
    }
    .mascot-container.sleeping .sleep-eyes {
      opacity: 1;
      background: #cfd6df;
    }
    .mascot-container.sleeping .zzz-bubble {
      opacity: 1;
      animation: floatZzz 1.6s ease-in-out infinite;
    }
    @keyframes floatZzz {
      0% { transform: translateY(0) scale(0.8); opacity: 0.3; }
      50% { opacity: 1; }
      100% { transform: translateY(-16px) scale(1.2); opacity: 0; }
    }
    @keyframes sleepFloat {
      0% { transform: translateY(3px) rotate(1deg); }
      100% { transform: translateY(8px) rotate(-1deg); }
    }

    /* 7. Думает */
    .mascot-container.thinking {
      animation: thinkTilt 1s ease-in-out infinite alternate;
    }
    @keyframes thinkTilt {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    /* Статус и реплика */
    .status-text {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 8px;
      height: 18px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 700;
      text-align: center;
    }

    .chat-bubble {
      margin-top: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 18px;
      max-width: 90%;
      min-height: 48px;
      max-height: 130px;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(20, 27, 38, 0.85);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
      gap: 12px;
      z-index: 10;
    }

    .mic-button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #82aaff, #6088ff);
      border: none;
      color: #0b0f17;
      font-size: 1.85rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 20px var(--accent-glow);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mic-button.active {
      background: linear-gradient(135deg, #ff5370, #ff2a55);
      box-shadow: 0 0 25px rgba(255, 83, 112, 0.8);
      transform: scale(1.1);
      animation: pulseGlow 1.2s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(255, 83, 112, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(255, 83, 112, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 83, 112, 0); }
    }

    .mic-hint {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* Окно настроек */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #0b0f17;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-wrap input[type="range"] {
      flex: 1;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .btn-save { background: var(--accent); color: #0b0f17; }
    .btn-test { background: rgba(255,255,255,0.08); color: #fff; }
    .btn-close { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Джем</span>
      <span class="brand-tag">Gemini 3.6</span>
    </div>
    <div class="header-actions">
      <button class="auto-toggle" id="autoModeBtn" onclick="toggleAutoMode()">
        <span>Авто-голос</span>
      </button>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
  </header>

  <main class="character-stage">
    <div class="mascot-container idle" id="mascot">
      <!-- Настоящий пушистый арт чиби-волчонка -->
      <img class="wolf-base-art" id="wolfImg" src="https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=2,quality=85,width=600/inputs/input_1730409890.png" alt="Джем" onerror="handleImgFallback(this)">

      <!-- Слой живой мимики и предметов -->
      <div class="face-overlay">
        <!-- Спящие закрытые глазки -->
        <div class="overlay-item sleep-eyes" id="sleepEyes">
          <div class="sleep-arc"></div>
          <div class="sleep-arc"></div>
        </div>

        <!-- Открывающийся ротик -->
        <div class="overlay-item talking-mouth" id="talkingMouth"></div>

        <!-- Сэндвич -->
        <div class="overlay-item sandwich-item" id="sandwich">🥪</div>

        <!-- Zzz -->
        <div class="overlay-item zzz-bubble" id="zzz">Zzz...</div>

        <!-- Ноты танца -->
        <div class="overlay-item notes" id="notes">🎵✨</div>
      </div>
    </div>

    <div class="status-text" id="statusText">Привет! Я твой Джем 🐾</div>
    <div class="chat-bubble" id="chatBubble">Нажми на микрофон, чтобы поговорить со мной!</div>
  </main>

  <footer class="controls">
    <button class="mic-button" id="micBtn" onclick="handleMicClick()">🎤</button>
    <div class="mic-hint" id="micHint">Нажми и говори</div>
  </footer>

  <!-- Окно настроек -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Настройки Джема</h2>

      <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="apiKeyInput" class="form-control" placeholder="Вставьте ваш API-ключ">
      </div>

      <div class="form-group">
        <label>Голос озвучки:</label>
        <select id="voiceSelect" class="form-control">
          <option value="">Загрузка голосов системы...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Высота голоса (тональность чиби): <span id="pitchVal">1.25</span></label>
        <div class="range-wrap">
          <input type="range" id="pitchInput" min="0.6" max="1.8" step="0.05" value="1.25" oninput="updatePitchVal(this.value)">
        </div>
      </div>

      <div class="form-group">
        <label>Скорость речи: <span id="rateVal">1.0</span></label>
        <div class="range-wrap">
          <input type="range" id="rateInput" min="0.7" max="1.4" step="0.05" value="1.0" oninput="updateRateVal(this.value)">
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-test" onclick="testVoice()">Тест голоса</button>
        <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
        <button class="btn btn-close" onclick="closeSettings()">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    let isListening = false;
    let autoMode = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let voices = [];
    
    // Система таймера бездействия
    let idleSeconds = 0;
    let idleTimer = null;

    const mascot = document.getElementById('mascot');
    const statusText = document.getElementById('statusText');
    const chatBubble = document.getElementById('chatBubble');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const autoModeBtn = document.getElementById('autoModeBtn');

    // Если картинка не подтянется по ссылке, используем локальный аватар
    function handleImgFallback(img) {
      img.src = "https://api.dicebear.com/7.x/bottts/svg?seed=wolf-jam";
    }

    // 1. Сброс и запуск таймера скуки
    function resetIdleTimer() {
      idleSeconds = 0;
      if (mascot.className !== 'mascot-container idle' && 
          !mascot.classList.contains('speaking') && 
          !mascot.classList.contains('listening') && 
          !mascot.classList.contains('thinking')) {
        setMascotState('idle', 'Джем ждёт 🐾');
      }
    }

    function startIdleTracker() {
      clearInterval(idleTimer);
      idleTimer = setInterval(() => {
        // Если идет разговор или слушание — таймер не тикает
        if (isListening || (synth && synth.speaking) || mascot.classList.contains('thinking')) {
          idleSeconds = 0;
          return;
        }

        idleSeconds++;

        if (idleSeconds === 12) {
          setMascotState('idle', 'Джем скучает...');
        } else if (idleSeconds === 22) {
          setMascotState('eating', 'Джем жуёт сэндвич 🥪');
          chatBubble.innerText = '*хрум-хрум* Вкусный сэндвич!';
        } else if (idleSeconds === 45) {
          setMascotState('dancing', 'Джем танцует ✨🎵');
          chatBubble.innerText = 'Лапками топ-топ! Танцуем, пока никто не видит!';
        } else if (idleSeconds === 75) {
          setMascotState('sleeping', 'Джем сладко спит... 💤');
          chatBubble.innerText = 'Zzz... Снится большая сахарная косточка...';
        }
      }, 1000);
    }
    startIdleTracker();

    function setMascotState(stateClass, label) {
      mascot.className = 'mascot-container ' + stateClass;
      statusText.innerText = label;
    }

    // 2. Голоса и настройки
    function loadVoices() {
      if (!synth) return;
      voices = synth.getVoices().filter(v => v.lang.startsWith('ru') || v.lang.startsWith('RU'));
      const select = document.getElementById('voiceSelect');
      select.innerHTML = '';

      if (voices.length === 0) {
        voices = synth.getVoices();
      }

      voices.forEach((voice, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${voice.name} (${voice.lang})`;
        select.appendChild(opt);
      });

      const savedVoice = localStorage.getItem('jam_voice_index');
      if (savedVoice !== null && select.options[savedVoice]) {
        select.value = savedVoice;
      }
    }

    if (synth) {
      loadVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    const savedPitch = localStorage.getItem('jam_pitch') || '1.25';
    const savedRate = localStorage.getItem('jam_rate') || '1.0';
    document.getElementById('pitchInput').value = savedPitch;
    document.getElementById('pitchVal').innerText = savedPitch;
    document.getElementById('rateInput').value = savedRate;
    document.getElementById('rateVal').innerText = savedRate;

    // 3. Микрофон и распознавание речи
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        resetIdleTimer();
        isListening = true;
        micBtn.classList.add('active');
        micHint.innerText = 'Слушаю тебя...';
        setMascotState('listening', 'Джем слушает ушком 🐾');
      };

      recognition.onresult = (e) => {
        resetIdleTimer();
        const text = e.results[0][0].transcript;
        chatBubble.innerText = 'Ты: ' + text;
        processUserQuery(text);
      };

      recognition.onerror = () => {
        stopListening();
        setMascotState('idle', 'Привет! Я Джем 🐾');
        micHint.innerText = 'Нажми и говори';
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      micHint.innerText = 'Микрофон не поддерживается браузером';
    }

    function handleMicClick() {
      resetIdleTimer();
      if (!recognition) {
        alert('Открой сайт через Chrome на телефоне!');
        return;
      }
      if (synth && synth.speaking) {
        synth.cancel();
      }
      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch(err) {
          console.log(err);
        }
      }
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('active');
    }

    // 4. Запрос к Gemini 3.6 Flash
    async function processUserQuery(query) {
      resetIdleTimer();
      setMascotState('thinking', 'Джем соображает...');
      const apiKey = localStorage.getItem('gemini_api_key');

      if (!apiKey) {
        setTimeout(() => {
          speakResponse("Я тебя отлично слышу! Но чтобы я стал умным и отвечал через нейросеть, добавь свой ключик в шестерёнку наверху!");
        }, 800);
        return;
      }

      try {
        const prompt = `Ты — Джем, маленький чиби-волчонок в черной оверсайз-футболке с эмблемой Gemini. У тебя пушистые серые ушки, белый животик и озорной характер. Отвечай дружелюбно, весело, без официоза, емко (1-2 предложения максимум). Вопрос человека: ${query}`;
        
        // Модель gemini-3.6-flash
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          console.error("Gemini Error:", data.error);
          speakResponse("Ой! Ошибка Gemini: " + (data.error.message || "проверь ключ в настройках"));
          return;
        }

        if (data.candidates && data.candidates[0] && data.candidates[0].content) {
          const reply = data.candidates[0].content.parts[0].text;
          speakResponse(reply);
        } else {
          speakResponse("Не удалось разобрать ответ от космоса.");
        }
      } catch (err) {
        console.error(err);
        speakResponse("Не могу связаться с Gemini. Проверь сеть или включи VPN!");
      }
    }

    // 5. Озвучка ответа
    function speakResponse(text) {
      resetIdleTimer();
      chatBubble.innerText = text;
      setMascotState('speaking', 'Джем говорит...');

      if (!synth) {
        setMascotState('idle', 'Джем 🐾');
        return;
      }

      synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';

      const select = document.getElementById('voiceSelect');
      if (voices.length > 0 && select.value !== '') {
        utterance.voice = voices[select.value];
      }

      utterance.pitch = parseFloat(localStorage.getItem('jam_pitch') || '1.25');
      utterance.rate = parseFloat(localStorage.getItem('jam_rate') || '1.0');

      utterance.onend = () => {
        setMascotState('idle', 'Привет! Я Джем 🐾');
        resetIdleTimer();
        if (autoMode) {
          setTimeout(() => {
            if (recognition && !isListening) {
              try { recognition.start(); } catch(e){}
            }
          }, 600);
        }
      };

      utterance.onerror = () => {
        setMascotState('idle', 'Привет! Я Джем 🐾');
        resetIdleTimer();
      };

      synth.speak(utterance);
    }

    function toggleAutoMode() {
      resetIdleTimer();
      autoMode = !autoMode;
      if (autoMode) {
        autoModeBtn.classList.add('active');
        if (!isListening && (!synth || !synth.speaking)) {
          handleMicClick();
        }
      } else {
        autoModeBtn.classList.remove('active');
      }
    }

    // Меню настроек
    function openSettings() {
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function updatePitchVal(v) {
      document.getElementById('pitchVal').innerText = v;
    }

    function updateRateVal(v) {
      document.getElementById('rateVal').innerText = v;
    }

    function testVoice() {
      const utterance = new SpeechSynthesisUtterance("Привет! Я пушистый волчонок Джем, проверяю свой новый звонкий голосок!");
      utterance.lang = 'ru-RU';
      const select = document.getElementById('voiceSelect');
      if (voices.length > 0 && select.value !== '') {
        utterance.voice = voices[select.value];
      }
      utterance.pitch = parseFloat(document.getElementById('pitchInput').value);
      utterance.rate = parseFloat(document.getElementById('rateInput').value);
      synth.cancel();
      synth.speak(utterance);
    }

    function saveSettings() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const voiceIndex = document.getElementById('voiceSelect').value;
      const pitch = document.getElementById('pitchInput').value;
      const rate = document.getElementById('rateInput').value;

      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('jam_voice_index', voiceIndex);
      localStorage.setItem('jam_pitch', pitch);
      localStorage.setItem('jam_rate', rate);

      closeSettings();
      resetIdleTimer();
      alert('Настройки сохранены!');
    }
  </script>
</body>
