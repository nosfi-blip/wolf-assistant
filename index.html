<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Джем — Волчонок-ассистент</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141b28;
      --accent: #7aa2f7;
      --accent-glow: rgba(122, 162, 247, 0.45);
      --text: #c0caf5;
      --text-dim: #7982a9;
      --border: #222c3f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background-image: radial-gradient(circle at 50% 25%, #182338 0%, #0b0f19 80%); }
    header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(20, 27, 40, 0.9); backdrop-filter: blur(10px); z-index: 10; }
    .brand { font-weight: 800; font-size: 1.15rem; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand-tag { font-size: 0.65rem; background: linear-gradient(135deg, #bb9af7, #7aa2f7); color: #0b0f19; padding: 2px 7px; border-radius: 10px; font-weight: 800; }
    .icon-btn { background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; }
    
    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; position: relative; }
    .mascot-box { width: 270px; height: 320px; position: relative; display: flex; justify-content: center; align-items: center; }
    .wolf-sprite { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.65)); transition: transform 0.25s ease; }
    
    .thinking .wolf-sprite { animation: thinkPulse 1s ease-in-out infinite alternate; }
    .listening .wolf-sprite { transform: scale(1.04); filter: drop-shadow(0 0 20px var(--accent-glow)); }
    
    @keyframes thinkPulse { 0% { transform: scale(0.98); } 100% { transform: scale(1.02); } }

    .status-text { font-size: 0.85rem; color: var(--accent); margin-top: 10px; height: 18px; font-weight: 700; text-transform: uppercase; text-align: center; }
    .chat-bubble { margin-top: 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px 18px; max-width: 90%; min-height: 52px; max-height: 150px; overflow-y: auto; font-size: 0.95rem; line-height: 1.45; text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); }

    .controls { padding: 16px; display: flex; flex-direction: column; align-items: center; background: rgba(20, 27, 40, 0.9); border-top: 1px solid var(--border); backdrop-filter: blur(10px); gap: 10px; }
    .mic-button { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #7aa2f7, #6088ff); border: none; color: #0b0f19; font-size: 1.85rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 20px var(--accent-glow); transition: all 0.25s; }
    .mic-button.active { background: linear-gradient(135deg, #f7768e, #ff4065); transform: scale(1.1); box-shadow: 0 0 25px rgba(247, 118, 142, 0.8); }
    .mic-hint { font-size: 0.8rem; color: var(--text-dim); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 1.2rem; margin-bottom: 14px; color: #fff; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px 12px; background: #0b0f19; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 0.85rem; outline: none; }
    .btn { width: 100%; padding: 11px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; margin-top: 8px; }
    .btn-save { background: var(--accent); color: #0b0f19; }
    .btn-clear { background: rgba(247, 118, 142, 0.15); color: #f7768e; border: 1px solid #f7768e; }
    .btn-close { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Джем</span>
      <span class="brand-tag" id="brandTag">Gemini 3.8</span>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </header>

  <main class="stage">
    <div class="mascot-box idle" id="mascotBox">
      <!-- Анимированный спрайт (автоматически подменяется на idle.gif, talk.gif и т.д.) -->
      <img class="wolf-sprite" id="wolfSprite" src="idle.gif" alt="Джем" onerror="handleImageFallback(this)">
    </div>

    <div class="status-text" id="statusText">Привет! Я Джем 🐾</div>
    <div class="chat-bubble" id="chatBubble">Нажми на микрофон, чтобы поговорить!</div>
  </main>

  <footer class="controls">
    <button class="mic-button" id="micBtn" onclick="handleMicClick()">🎤</button>
    <div class="mic-hint" id="micHint">Нажми и говори</div>
  </footer>

  <!-- Окно настроек -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Настройки Джема</h2>

      <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="apiKeyInput" class="form-control" placeholder="Вставьте ваш API-ключ">
      </div>

      <div class="form-group">
        <label>Модель Gemini:</label>
        <input type="text" id="modelInput" class="form-control" value="gemini-3.8-flash">
      </div>

      <div class="form-group">
        <label>Голос озвучки:</label>
        <select id="voiceSelect" class="form-control">
          <option value="neural_female">Онлайн: Светлана (Нейросеть)</option>
          <option value="neural_male">Онлайн: Дмитрий (Нейросеть)</option>
          <option value="system">Системный синтезатор телефона</option>
        </select>
      </div>

      <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
      <button class="btn btn-clear" onclick="clearMemory()">Очистить память диалога</button>
      <button class="btn btn-close" onclick="closeSettings()">Закрыть</button>
    </div>
  </div>

  <script>
    let isListening = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let audioPlayer = new Audio();
    
    let lastAction = Date.now();
    let currentEmotion = 'idle';

    // ПАМЯТЬ ДИАЛОГА (история сообщений)
    let chatHistory = JSON.parse(localStorage.getItem('jam_chat_history') || '[]');

    const mascotBox = document.getElementById('mascotBox');
    const wolfSprite = document.getElementById('wolfSprite');
    const statusText = document.getElementById('statusText');
    const chatBubble = document.getElementById('chatBubble');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const brandTag = document.getElementById('brandTag');

    // Файлы анимаций
    const SPRITES = {
      idle: 'idle.gif',
      talk: 'talk.gif',
      eat: 'eat.gif',
      dance: 'dance.gif',
      sleep: 'sleep.gif'
    };

    const LABELS = {
      idle: 'Привет! Я Джем 🐾',
      listening: 'Джем слушает ушком 🐾',
      thinking: 'Джем думает...',
      speaking: 'Джем говорит...',
      eating: 'Джем жуёт сэндвич 🥪',
      dancing: 'Джем танцует ✨🐾',
      sleeping: 'Джем сладко спит... 💤'
    };

    // Фолбэк на статический арт, если гифка еще не загружена в репозиторий
    function handleImageFallback(img) {
      if (!img.src.endsWith('wolf.png')) {
        img.src = 'wolf.png';
      }
    }

    function setSpriteState(state) {
      currentEmotion = state;
      mascotBox.className = 'mascot-box ' + state;
      statusText.innerText = LABELS[state] || 'Джем 🐾';

      // Переключаем кадр/гифку
      const targetSprite = SPRITES[state] || SPRITES.idle;
      if (wolfSprite.getAttribute('src') !== targetSprite) {
        wolfSprite.src = targetSprite;
      }
    }

    function resetActivity() {
      lastAction = Date.now();
      if (!['speaking', 'listening', 'thinking'].includes(currentEmotion)) {
        setSpriteState('idle');
      }
    }

    // Таймер бездействия
    setInterval(() => {
      if (isListening || (synth && synth.speaking) || !audioPlayer.paused || ['thinking', 'speaking', 'listening'].includes(currentEmotion)) {
        lastAction = Date.now();
        return;
      }

      const sec = Math.floor((Date.now() - lastAction) / 1000);

      if (sec >= 75 && currentEmotion !== 'sleep') {
        setSpriteState('sleep');
        chatBubble.innerText = 'Снится сахарная косточка... 💤';
      } else if (sec >= 50 && sec < 75 && currentEmotion !== 'dance') {
        setSpriteState('dance');
        chatBubble.innerText = 'Лапками топ-топ! Танцуем! 🎵';
      } else if (sec >= 25 && sec < 50 && currentEmotion !== 'eat') {
        setSpriteState('eat');
        chatBubble.innerText = 'Хрум-хрум! Вкусный сэндвич! 🥪';
      } else if (sec >= 12 && sec < 25 && currentEmotion === 'idle') {
        statusText.innerText = 'Джем скучает...';
      }
    }, 1000);

    // Загрузка сохранённых настроек
    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    const savedModel = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';
    document.getElementById('modelInput').value = savedModel;
    brandTag.innerText = savedModel.replace('gemini-', '');
    document.getElementById('voiceSelect').value = localStorage.getItem('jam_voice') || 'neural_female';

    // Микрофон
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        resetActivity();
        isListening = true;
        micBtn.classList.add('active');
        micHint.innerText = 'Слушаю тебя...';
        setSpriteState('listening');
      };
      recognition.onresult = (e) => {
        resetActivity();
        const text = e.results[0][0].transcript;
        chatBubble.innerText = 'Ты: ' + text;
        askGeminiWithMemory(text);
      };
      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('active');
        setSpriteState('idle');
        micHint.innerText = 'Нажми и говори';
      };
      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
      };
    }

    function handleMicClick() {
      resetActivity();
      if (!recognition) { alert('Открой через Chrome на телефоне!'); return; }
      if (synth && synth.speaking) synth.cancel();
      if (!audioPlayer.paused) { audioPlayer.pause(); audioPlayer.currentTime = 0; }

      if (isListening) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch(e){}
      }
    }

    function cleanForSpeech(raw) {
      return (raw || '')
        .replace(/\*[^*]*\*/g, '')
        .replace(/\([^\)]*\)/g, '')
        .replace(/\[[^\]]*\]/g, '')
        .replace(/[\p{Extended_Pictographic}\uFE0F]/gu, '')
        .replace(/[*_#~`]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Запрос к Gemini с сохранением всей цепочки диалога
    async function askGeminiWithMemory(userQuery) {
      resetActivity();
      setSpriteState('thinking');
      const apiKey = localStorage.getItem('gemini_api_key');
      const model = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';

      if (!apiKey) {
        speak("Я тебя слышу! Но чтобы я начал отвечать, вставь свой API-ключ в шестерёнку наверху!");
        return;
      }

      // Добавляем реплику пользователя в память
      chatHistory.push({ role: "user", parts: [{ text: userQuery }] });

      // Оставляем последние 16 реплик для баланса памяти и скорости
      if (chatHistory.length > 16) {
        chatHistory = chatHistory.slice(-16);
      }

      const systemPrompt = "Ты — Джем, сообразительный, дружелюбный и преданный чиби-волчонок в черной футболке с логотипом Gemini. Ты общаешься голосом вслух! КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО использовать звездочки, скобки, смайлы и описывать свои действия от третьего лица. Отвечай живой устной речью от первого лица. Ты помнишь всё, о чём вы говорили раньше, общайся естественно, тепло и развёрнуто.";

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemPrompt }] },
            contents: chatHistory
          })
        });

        const data = await res.json();
        if (data.error) {
          speak("Ошибка Gemini: " + (data.error.message || "проверь ключ в настройках"));
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          // Запоминаем ответ Джема
          chatHistory.push({ role: "model", parts: [{ text: reply }] });
          localStorage.setItem('jam_chat_history', JSON.stringify(chatHistory));

          const cleanReply = cleanForSpeech(reply);
          speak(cleanReply || reply);
        } else {
          speak("Не удалось получить ответ.");
        }
      } catch (err) {
        speak("Не могу связаться с Gemini. Проверь интернет или VPN!");
      }
    }

    // Озвучка ответа и включение анимации рта
    function speak(text) {
      resetActivity();
      const txt = cleanForSpeech(text);
      chatBubble.innerText = txt;
      setSpriteState('talk');

      const vMode = localStorage.getItem('jam_voice') || 'neural_female';
      const onEnd = () => {
        setSpriteState('idle');
        resetActivity();
      };

      if (vMode.startsWith('neural')) {
        const vName = vMode === 'neural_female' ? 'ru-RU-SvetlanaNeural' : 'ru-RU-DmitryNeural';
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.src = `https://api.streamelements.com/kappa/v2/speech?voice=${vName}&text=${encodeURIComponent(txt)}`;
        audioPlayer.onended = onEnd;
        audioPlayer.onerror = () => fallbackSpeak(txt, onEnd);
        audioPlayer.play().catch(() => fallbackSpeak(txt, onEnd));
      } else {
        fallbackSpeak(txt, onEnd);
      }
    }

    function fallbackSpeak(txt, cb) {
      if (!synth) { if(cb) cb(); return; }
      synth.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ru-RU';
      u.onend = () => { if(cb) cb(); };
      u.onerror = () => { if(cb) cb(); };
      synth.speak(u);
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    
    function saveSettings() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const model = document.getElementById('modelInput').value.trim() || 'gemini-3.8-flash';
      const voice = document.getElementById('voiceSelect').value;

      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('gemini_model', model);
      localStorage.setItem('jam_voice', voice);

      brandTag.innerText = model.replace('gemini-', '');
      closeSettings();
      resetActivity();
      chatBubble.innerText = 'Настройки сохранены! ✨';
    }

    function clearMemory() {
      chatHistory = [];
      localStorage.removeItem('jam_chat_history');
      closeSettings();
      chatBubble.innerText = 'Память очищена! Начнём сначала 🐾';
    }
  </script>
</body>
</html>
