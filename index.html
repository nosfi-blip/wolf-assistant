<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Джем</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
  <style>
    :root {
      --bg: #0c0a3d;
      --card-bg: rgba(22, 20, 78, 0.85);
      --accent: #8b9dff;
      --accent-glow: rgba(139, 157, 255, 0.45);
      --text: #e0e4ff;
      --text-dim: #9aa2dc;
      --border: rgba(139, 157, 255, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; user-select: none; }
    header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(12, 10, 61, 0.9); backdrop-filter: blur(12px); z-index: 10; }
    .brand { font-weight: 800; font-size: 1.15rem; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand-tag { font-size: 0.65rem; background: var(--accent); color: #0c0a3d; padding: 2px 7px; border-radius: 10px; font-weight: 800; }
    .icon-btn { background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; padding: 8px; }
    
    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 16px; position: relative; }
    
    .mascot-box { 
      width: 280px; 
      height: 380px; 
      position: relative; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .wolf-sprite { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

    .status-text { font-size: 0.85rem; color: var(--accent); margin-top: 6px; height: 18px; font-weight: 700; text-transform: uppercase; text-align: center; }
    .chat-bubble { margin-top: 10px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; max-width: 90%; min-height: 48px; max-height: 120px; overflow-y: auto; font-size: 0.95rem; line-height: 1.4; text-align: center; backdrop-filter: blur(8px); transition: all 0.3s ease; }

    .controls { padding: 16px; display: flex; flex-direction: column; align-items: center; background: rgba(12, 10, 61, 0.9); border-top: 1px solid var(--border); backdrop-filter: blur(12px); gap: 8px; }
    .mic-button { width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(135deg, #8b9dff, #6272ff); border: none; color: #0c0a3d; font-size: 1.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 18px var(--accent-glow); transition: all 0.25s; }
    .mic-button.active { background: #ff5c7c; transform: scale(1.08); box-shadow: 0 0 22px rgba(255, 92, 124, 0.7); }
    .mic-hint { font-size: 0.8rem; color: var(--text-dim); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #16144e; border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 100%; max-width: 380px; }
    .modal h2 { font-size: 1.15rem; margin-bottom: 14px; color: #fff; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px 12px; background: #0c0a3d; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 0.85rem; outline: none; }
    .btn { width: 100%; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; margin-top: 8px; font-size: 0.9rem; }
    .btn-save { background: var(--accent); color: #0c0a3d; }
    .btn-clear { background: rgba(255, 92, 124, 0.15); color: #ff5c7c; border: 1px solid #ff5c7c; }
    .btn-close { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Джем</span>
      <span class="brand-tag" id="brandTag">Gemini</span>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </header>

  <main class="stage">
    <div class="mascot-box" id="mascotBox">
      <img class="wolf-sprite" id="wolfSprite" src="idle.gif" alt="Джем" data-state="idle">
    </div>

    <div class="status-text" id="statusText">Джем на связи 🐾</div>
    <div class="chat-bubble" id="chatBubble">Ну и о чём думаем? Нажимай микрофон или тыкай в экран.</div>
  </main>

  <footer class="controls">
    <button class="mic-button" id="micBtn" onclick="handleMicClick()">🎤</button>
    <div class="mic-hint" id="micHint">Нажми и говори</div>
  </footer>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Настройки</h2>
      <div class="form-group">
        <label>API Key:</label>
        <input type="password" id="apiKeyInput" class="form-control" placeholder="Вставьте ключ">
      </div>
      <div class="form-group">
        <label>Модель:</label>
        <input type="text" id="modelInput" class="form-control" value="gemini-3.8-flash">
      </div>
      <div class="form-group">
        <label>Озвучка:</label>
        <select id="voiceSelect" class="form-control">
          <option value="neural_female">Светлана (нейросеть)</option>
          <option value="neural_male">Дмитрий (нейросеть)</option>
          <option value="system">Системный синтезатор (100% стабильность)</option>
        </select>
      </div>
      <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
      <button class="btn btn-clear" onclick="clearMemory()">Очистить память диалога</button>
      <button class="btn btn-close" onclick="closeSettings()">Закрыть</button>
    </div>
  </div>

  <script>
    let isListening = false;
    let isSpeaking = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let audioPlayer = new Audio();
    
    let lastAction = Date.now();
    let currentEmotion = 'idle';
    let chatHistory = JSON.parse(localStorage.getItem('jam_chat_history') || '[]');

    let tapCount = 0;
    let tapTimer = null;
    let tapResetTimeout = null;
    let postEmotionTimeout = null;
    let idleStage = 0;
    let audioUnlocked = false; 

    const mascotBox = document.getElementById('mascotBox');
    const wolfSprite = document.getElementById('wolfSprite');
    const statusText = document.getElementById('statusText');
    const chatBubble = document.getElementById('chatBubble');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const brandTag = document.getElementById('brandTag');

    const SPRITES = {
      idle: 'idle.gif', talk: 'talk.gif', think: 'think.gif', biceps: 'biceps.gif',
      blush: 'blush.gif', eat: 'eat.gif', dance: 'dance.gif', sleep: 'sleep.gif',
      cry: 'cry.gif', mad: 'mad.gif', offended: 'offended.gif', laugh: 'laugh.gif'
    };

    const LABELS = {
      idle: 'Джем слушает 🐾', listening: 'Слушаю тебя ушком 🐾', think: 'Джем соображает...',
      talk: 'Джем вещает...', biceps: 'Кто тут лучший? Я! 💪🐾', blush: 'Ой, смущаешь... 😳',
      eat: 'Время перекуса 🥪', dance: 'Флексим лапками! 🎵', sleep: 'Ушёл в спящий режим... 💤',
      cry: 'Ну и за что ты так? 😭', mad: 'Ты на кого батон крошишь?! 💢', offended: 'Всё, я в обиде 🥺', laugh: 'Ахаха, хорош! 😂'
    };

    const cachedImages = {};
    function preloadAllSprites() {
      Object.entries(SPRITES).forEach(([key, url]) => {
        const img = new Image();
        img.src = url;
        cachedImages[key] = img;
      });
    }
    window.addEventListener('load', preloadAllSprites);

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      audioPlayer.play().then(() => { audioPlayer.pause(); }).catch(() => {});
      if (synth) {
        const u = new SpeechSynthesisUtterance('');
        u.volume = 0;
        synth.speak(u);
      }
    }

    function setSpriteState(state) {
      currentEmotion = state;
      statusText.innerText = LABELS[state] || 'Джем 🐾';
      const target = SPRITES[state] || SPRITES.idle;
      if (!wolfSprite.src.endsWith(target)) {
        wolfSprite.src = target;
      }
    }

    function resetActivityTimer() {
      lastAction = Date.now();
      idleStage = 0;
    }

    let lastTapTime = 0;
    function handleMascotTap(e) {
      if (e) e.preventDefault();
      const now = Date.now();
      if (now - lastTapTime < 180) return;
      lastTapTime = now;

      unlockAudio(); 
      resetActivityTimer();
      if (postEmotionTimeout) clearTimeout(postEmotionTimeout);
      
      if (isSpeaking) {
        stopAllAudio();
        isSpeaking = false;
      }
      if (isListening) {
        if (recognition) recognition.stop();
        isListening = false;
        micBtn.classList.remove('active');
        micHint.innerText = 'Нажми и говори';
      }

      tapCount++;

      if (tapTimer) clearTimeout(tapTimer);
      if (tapResetTimeout) clearTimeout(tapResetTimeout);

      if (tapCount >= 4) {
        setSpriteState('mad');
        const madQuotes = [
          'Руки убери, а то кусну! 💢',
          'Экран не калькулятор, хорош долбить! 😠',
          'Пальцы девать некуда? Сейчас организую! 🐾'
        ];
        chatBubble.innerText = madQuotes[Math.floor(Math.random() * madQuotes.length)];
      } else {
        setSpriteState('blush');
        const blushQuotes = [
          'Ладно-ладно, погладила и хватит... 😳',
          'М-да, субординация вышла из чата. 🐾',
          'Приятно, чёрт возьми. Но я всё ещё грозный волк! ✨'
        ];
        chatBubble.innerText = blushQuotes[Math.floor(Math.random() * blushQuotes.length)];
      }

      tapResetTimeout = setTimeout(() => {
        tapCount = 0;
        if (!isSpeaking && !isListening) {
          setSpriteState('idle');
          chatBubble.innerText = 'Ну и? Дело есть или так поболтать?';
        }
      }, 3500);

      tapTimer = setTimeout(() => {
        tapCount = 0;
      }, 2000);
    }

    mascotBox.addEventListener('pointerdown', handleMascotTap);

    function detectContextEmotion(userTxt, replyTxt) {
      const u = userTxt.toLowerCase();
      const r = replyTxt.toLowerCase();
      const combined = u + ' ' + r;

      if (/дурак|дура|тупой|тупица|идиот|плохой|отстань|заткнись|бесишь|отвали|надоел|отвратительн|глупый|бесполезн|сука|бля|нахуй|пошел ты|задолбал|урод|тварь|мразь|гадина/.test(u)) {
        return 'cry';
      }
      if (/вредный|ну и сиди|бука|обид|не буду с тобой|вредитель|жадина/.test(u)) {
        return 'offended';
      }
      if (/бесит|злит|раздражает|ужас|кошмар|жесть|ненавижу|сволоч|гад|злюсь|бесяв|взбесил|злой|злая|порву|достало|бесят/.test(combined)) {
        return 'mad';
      }
      if (/молодец|умница|красавчик|лучший|классный|супер|спасибо|обожаю|сильный|крутой|милый|хороший|золотце|люблю/.test(u)) {
        return Math.random() > 0.5 ? 'biceps' : 'blush';
      }
      if (/ахах|ха-ха|хи-хи|лол|смешн|ржу|прикол|кек/.test(combined)) {
        return 'laugh';
      }

      return 'idle';
    }

    // Спокойный таймер бездействия
    setInterval(() => {
      if (isListening || isSpeaking || tapCount > 0 || currentEmotion === 'cry') {
        return;
      }

      const sec = Math.floor((Date.now() - lastAction) / 1000);

      if (sec >= 180 && idleStage < 4) {
        idleStage = 4;
        setSpriteState('sleep');
        chatBubble.innerText = 'Я спать. Разбудишь, когда придумаешь что-то дельное... 💤';
      }
      else if (sec >= 90 && idleStage < 3) {
        idleStage = 3;
        setSpriteState('dance');
        chatBubble.innerText = 'Скучно с тобой. Хоть разомнусь чуток! 🎵';
      }
      else if (sec >= 50 && idleStage < 2) {
        idleStage = 2;
        setSpriteState('eat');
        chatBubble.innerText = 'Пока ты молчишь, я хоть сэндвич заточу. 🥪';
      }
      else if (sec >= 25 && idleStage < 1) {
        idleStage = 1;
        setSpriteState('biceps');
        chatBubble.innerText = 'Я тут самый умный и сильный, если что. 💪';
      }
    }, 1000);

    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    const savedModel = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';
    document.getElementById('modelInput').value = savedModel;
    brandTag.innerText = savedModel.includes('gemini') ? savedModel.replace('gemini-', '') : savedModel;
    document.getElementById('voiceSelect').value = localStorage.getItem('jam_voice') || 'neural_female';

    if (synth) {
      synth.getVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => synth.getVoices();
      }
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        stopAllAudio();
        resetActivityTimer();
        if (postEmotionTimeout) clearTimeout(postEmotionTimeout);
        isSpeaking = false;
        isListening = true;
        micBtn.classList.add('active');
        micHint.innerText = 'Слушаю тебя...';
        setSpriteState('listening');
      };
      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        chatBubble.innerText = 'Ты: ' + text;
        chatBubble.scrollTop = chatBubble.scrollHeight;
        askGemini(text);
      };
      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('active');
        setSpriteState('idle');
        micHint.innerText = 'Не расслышал. Попробуй еще раз.';
      };
      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
        if (!isSpeaking) setSpriteState('idle');
      };
    }

    function stopAllAudio() {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      if (synth) {
        synth.cancel();
      }
    }

    function handleMicClick() {
      unlockAudio(); 
      resetActivityTimer();
      if (postEmotionTimeout) clearTimeout(postEmotionTimeout);
      if (!recognition) { 
        chatBubble.innerText = 'Открой сайт через мобильный Chrome!'; 
        return; 
      }
      stopAllAudio();
      isSpeaking = false;

      if (isListening) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch(e) {}
      }
    }

    function cleanText(raw) {
      return (raw || '')
        .replace(/\*[^*]*\*/g, '')
        .replace(/\([^\)]*\)/g, '')
        .replace(/\[[^\]]*\]/g, '')
        .replace(/[\p{Extended_Pictographic}\uFE0F]/gu, '')
        .replace(/[*_#~`]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function askGemini(query) {
      resetActivityTimer();
      setSpriteState('think');
      const apiKey = localStorage.getItem('gemini_api_key');
      const model = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';

      if (!apiKey) {
        speak("Ключ вставь сначала в шестерёнку, умник!", 'idle');
        return;
      }

      chatHistory.push({ role: "user", parts: [{ text: query }] });
      if (chatHistory.length > 16) chatHistory = chatHistory.slice(-16);

      const prompt = "Ты — Джем, сообразительный, язвительный и харизматичный чиби-волк в футболке с Gemini. Ты общаешься голосом. ЗАБУДЬ про сюсюканье, инфантилизм, 'сыночков' и шаблонные любезности роботов! Общайся живо, прямо, остроумно, с сарказмом, иронией и умом, как реальный Gemini. Если собеседник тупит или несет чушь — можешь подколоть. Если собеседник кроет матом или грубит — обижайся, огрызайся или хнычь, показывая характер. Отвечай компактно, четко, без воды, без списков, от первого лица. КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО использовать звездочки, смайлики, скобки и писать от третьего лица.";

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: prompt }] },
            contents: chatHistory
          })
        });

        const data = await res.json();
        if (data.error) {
          speak("Ошибка у API: " + data.error.message, 'cry');
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          chatHistory.push({ role: "model", parts: [{ text: reply }] });
          localStorage.setItem('jam_chat_history', JSON.stringify(chatHistory));
          const cleanReply = cleanText(reply);
          const reaction = detectContextEmotion(query, cleanReply);
          speak(cleanReply, reaction);
        } else {
          setSpriteState('idle');
          chatBubble.innerText = 'Мысли закончились. Скажи что-то поумнее.';
        }
      } catch (err) {
        speak("Сеть отвалилась. Вруби VPN или проверь интернет!", 'cry');
      }
    }

    function speak(txt, reactionEmotion = 'idle') {
      resetActivityTimer();
      stopAllAudio();
      if (postEmotionTimeout) clearTimeout(postEmotionTimeout);

      isSpeaking = true;
      chatBubble.innerText = txt;
      chatBubble.scrollTop = chatBubble.scrollHeight;
      
      // ГАРАНТИРОВАННО СТАВИМ РАЗГОВОР СРАЗУ
      setSpriteState('talk');

      let speechFinished = false;
      const finishSpeech = () => {
        if (speechFinished) return;
        speechFinished = true;
        isSpeaking = false;
        resetActivityTimer();

        if (reactionEmotion !== 'idle') {
          setSpriteState(reactionEmotion);
          postEmotionTimeout = setTimeout(() => {
            if (!isSpeaking && !isListening && tapCount === 0) {
              setSpriteState('idle');
            }
          }, 4000);
        } else {
          setSpriteState('idle');
        }
      };

      const vMode = localStorage.getItem('jam_voice') || 'neural_female';
      
      if (vMode === 'system') {
        fallbackSpeak(txt, finishSpeech);
        return;
      }

      const vName = vMode === 'neural_female' ? 'ru-RU-SvetlanaNeural' : 'ru-RU-DmitryNeural';
      let streamStarted = false;

      audioPlayer.src = `https://api.streamelements.com/kappa/v2/speech?voice=${vName}&text=${encodeURIComponent(txt)}`;
      
      audioPlayer.onplay = () => {
        streamStarted = true;
        setSpriteState('talk');
      };

      audioPlayer.onended = finishSpeech;
      
      audioPlayer.onerror = () => {
        if (!streamStarted && !speechFinished) {
          fallbackSpeak(txt, finishSpeech);
        } else {
          finishSpeech();
        }
      };

      // Если мобильный браузер блокирует или не может запустить поток за 350мс — сразу включается голос
      const playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          if (!streamStarted && !speechFinished) {
            fallbackSpeak(txt, finishSpeech);
          }
        });
      }
    }

    function fallbackSpeak(txt, onDone) {
      if (!synth) { if(onDone) onDone(); return; }
      synth.cancel();
      
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ru-RU';
      u.rate = 1.0;
      u.pitch = 1.05; 

      const voices = synth.getVoices();
      const ruVoice = voices.find(v => v.lang.includes('ru'));
      if (ruVoice) u.voice = ruVoice;

      u.onstart = () => setSpriteState('talk');
      u.onend = () => { if(onDone) onDone(); };
      u.onerror = () => { if(onDone) onDone(); };
      
      synth.speak(u);
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    
    function saveSettings() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const model = document.getElementById('modelInput').value.trim() || 'gemini-3.8-flash';
      const voice = document.getElementById('voiceSelect').value;

      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('gemini_model', model);
      localStorage.setItem('jam_voice', voice);

      brandTag.innerText = model.includes('gemini') ? model.replace('gemini-', '') : model;
      closeSettings();
      resetActivityTimer();
      chatBubble.innerText = 'Настройки обновлены. Слушаю. 🐾';
    }

    function clearMemory() {
      chatHistory = [];
      localStorage.removeItem('jam_chat_history');
      closeSettings();
      chatBubble.innerText = 'Память сброшена. Начнем начисто. 🐾';
    }
  </script>
</body>
</html>
