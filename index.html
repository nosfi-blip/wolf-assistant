<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Джем — Живой чиби-волчонок</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141b28;
      --accent: #7aa2f7;
      --accent-glow: rgba(122, 162, 247, 0.45);
      --text: #c0caf5;
      --text-dim: #7982a9;
      --border: #222c3f;
      --active-btn: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-image: radial-gradient(circle at 50% 25%, #182338 0%, #0b0f19 80%);
    }

    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background-color: rgba(20, 27, 40, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.15rem;
      color: #fff;
    }

    .brand-tag {
      font-size: 0.65rem;
      background: linear-gradient(135deg, #bb9af7, #7aa2f7);
      color: #0b0f19;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .auto-toggle {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s;
    }

    .auto-toggle.active {
      background: var(--active-btn);
      color: #0b0f19;
      border-color: var(--active-btn);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
    }

    .character-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      position: relative;
    }

    .mascot-box {
      width: 280px;
      height: 330px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg#jam-wolf {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.65));
      transform-origin: bottom center;
    }

    /* === Стили и анимации мимики и состояний === */

    /* Покой */
    .idle svg#jam-wolf {
      animation: jamBreathe 3.5s ease-in-out infinite alternate;
    }
    @keyframes jamBreathe {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-5px) scale(1.015); }
    }

    /* Моргание */
    .eye-round {
      transform-origin: 150px 148px;
      transition: transform 0.1s ease;
    }
    .blinking .eye-round {
      transform: scaleY(0.08);
    }

    /* Слушает */
    .listening #ear-left {
      animation: earWiggle 0.4s ease-in-out infinite alternate;
    }
    @keyframes earWiggle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-8deg); }
    }

    /* Говорит */
    .speaking svg#jam-wolf {
      animation: jamTalkBounce 0.22s ease-in-out infinite alternate;
    }
    .speaking #mouth-open-path {
      display: block !important;
      animation: mouthFlap 0.18s ease-in-out infinite alternate;
      transform-origin: 150px 172px;
    }
    .speaking #mouth-closed-path {
      display: none !important;
    }
    @keyframes jamTalkBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px) scale(1.02); }
    }
    @keyframes mouthFlap {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1.25); }
    }

    /* Думает */
    .thinking svg#jam-wolf {
      animation: jamThinkTilt 1s ease-in-out infinite alternate;
    }
    @keyframes jamThinkTilt {
      0% { transform: rotate(-4deg) translateY(-2px); }
      100% { transform: rotate(4deg) translateY(-6px); }
    }

    /* Злится */
    .angry #brow-left { transform: rotate(18deg) translate(2px, 4px); }
    .angry #brow-right { transform: rotate(-18deg) translate(-2px, 4px); }
    .angry #fx-anger { display: block !important; }
    .angry #mouth-open-path {
      display: block !important;
      fill: #ef4444;
    }
    .angry #mouth-closed-path {
      display: none !important;
    }
    .angry svg#jam-wolf {
      animation: angerShake 0.12s ease-in-out infinite alternate;
    }
    @keyframes angerShake {
      0% { transform: translateX(-2px); }
      100% { transform: translateX(2px); }
    }

    /* Грустит / обижается */
    .sad #brow-left { transform: rotate(-16deg) translate(-2px, -3px); }
    .sad #brow-right { transform: rotate(16deg) translate(2px, -3px); }
    .sad #ear-left { transform: rotate(-14deg) translateY(6px); }
    .sad #ear-right { transform: rotate(14deg) translateY(6px); }
    .sad #fx-tear { display: block !important; }

    /* Смущается */
    .blushing #fx-blush { display: block !important; }
    .blushing #ear-left { transform: rotate(-8deg); }
    .blushing #ear-right { transform: rotate(8deg); }
    .blushing .eye-round { transform: translate(-3px, 2px); }

    /* Ест сэндвич */
    .eating #jam-sandwich {
      display: block !important;
      animation: chewSandwich 0.35s ease-in-out infinite alternate;
      transform-origin: 150px 215px;
    }
    @keyframes chewSandwich {
      0% { transform: translateY(0) rotate(-4deg); }
      100% { transform: translateY(-5px) rotate(4deg); }
    }

    /* Танцует */
    .dancing svg#jam-wolf {
      animation: jamDance 0.45s ease-in-out infinite alternate;
    }
    .dancing #fx-notes { display: block !important; }
    @keyframes jamDance {
      0% { transform: rotate(-7deg) translateY(-8px); }
      100% { transform: rotate(7deg) translateY(0); }
    }

    /* Спит */
    .sleeping .eye-round { display: none; }
    .sleeping .eye-sleep { display: block !important; }
    .sleeping #fx-zzz { display: block !important; }
    .sleeping svg#jam-wolf {
      animation: jamSleep 3s ease-in-out infinite alternate;
    }
    @keyframes jamSleep {
      0% { transform: translateY(4px) rotate(1deg); }
      100% { transform: translateY(9px) rotate(-1deg); }
    }

    /* Хвостик */
    #jam-tail {
      transform-origin: 195px 235px;
      animation: tailWag 2.5s ease-in-out infinite alternate;
    }
    .speaking #jam-tail, .dancing #jam-tail {
      animation: tailWagFast 0.32s ease-in-out infinite alternate;
    }
    @keyframes tailWag {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(6deg); }
    }
    @keyframes tailWagFast {
      0% { transform: rotate(-14deg); }
      100% { transform: rotate(14deg); }
    }

    /* Текст статуса и бабл */
    .status-text {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 10px;
      height: 18px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 700;
      text-align: center;
    }

    .chat-bubble {
      margin-top: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 18px;
      max-width: 90%;
      min-height: 48px;
      max-height: 130px;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(20, 27, 40, 0.9);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
      gap: 12px;
      z-index: 10;
    }

    .mic-button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7aa2f7, #6088ff);
      border: none;
      color: #0b0f19;
      font-size: 1.85rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 20px var(--accent-glow);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mic-button.active {
      background: linear-gradient(135deg, #f7768e, #ff4065);
      box-shadow: 0 0 25px rgba(247, 118, 142, 0.8);
      transform: scale(1.1);
      animation: pulseGlow 1.2s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(247, 118, 142, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(247, 118, 142, 0); }
      100% { box-shadow: 0 0 0 0 rgba(247, 118, 142, 0); }
    }

    .mic-hint {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* Модалка настроек */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-wrap input[type="range"] {
      flex: 1;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .btn-save { background: var(--accent); color: #0b0f19; }
    .btn-test { background: rgba(255,255,255,0.08); color: #fff; }
    .btn-close { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Джем</span>
      <span class="brand-tag">Gemini 3.6</span>
    </div>
    <div class="header-actions">
      <button class="auto-toggle" id="autoModeBtn" onclick="toggleAutoMode()">
        <span>Авто-голос</span>
      </button>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
  </header>

  <main class="character-stage">
    <div class="mascot-box idle" id="mascotBox">
      <svg id="jam-wolf" viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="geminiGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- Пушистый хвост -->
        <g id="jam-tail">
          <path d="M 190 240 C 235 240 265 210 255 180 C 248 198 230 205 215 200 C 218 215 205 230 185 235 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 255 180 C 248 198 230 205 215 200 C 228 185 242 180 255 180 Z" fill="#ffffff" stroke="#363d4e" stroke-width="4"/>
        </g>

        <!-- Лапки задние -->
        <g id="jam-feet">
          <rect x="105" y="275" width="34" height="28" rx="14" fill="#ffffff" stroke="#363d4e" stroke-width="5"/>
          <path d="M 116 288 L 116 298 M 128 288 L 128 298" stroke="#363d4e" stroke-width="3" stroke-linecap="round"/>

          <rect x="160" y="275" width="34" height="28" rx="14" fill="#ffffff" stroke="#363d4e" stroke-width="5"/>
          <path d="M 171 288 L 171 298 M 183 288 L 183 298" stroke="#363d4e" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Футболка -->
        <g id="jam-shirt">
          <path d="M 90 205 Q 150 215 210 205 L 218 280 Q 150 290 82 280 Z" fill="#1c2029" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 95 208 L 65 235 L 82 250 L 102 225 Z" fill="#1c2029" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 205 208 L 235 235 L 218 250 L 198 225 Z" fill="#1c2029" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <circle cx="68" cy="242" r="12" fill="#ffffff" stroke="#363d4e" stroke-width="4"/>
          <circle cx="232" cy="242" r="12" fill="#ffffff" stroke="#363d4e" stroke-width="4"/>

          <g filter="url(#geminiGlow)">
            <path d="M 140 236 L 160 236 M 143 256 L 163 256 M 148 232 L 143 260 M 155 232 L 160 260" stroke="#a5b4fc" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="140" cy="236" r="2.2" fill="#ffffff"/>
            <circle cx="160" cy="236" r="2.2" fill="#ffffff"/>
            <circle cx="143" cy="256" r="2.2" fill="#ffffff"/>
            <circle cx="163" cy="256" r="2.2" fill="#ffffff"/>
          </g>
        </g>

        <!-- Левое ухо -->
        <g id="ear-left" style="transform-origin: 90px 115px; transition: transform 0.3s ease;">
          <path d="M 72 115 C 50 70 70 18 102 38 C 115 70 108 105 98 118 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 78 105 C 64 74 76 38 98 52 C 105 72 100 96 94 106 Z" fill="#5a6273"/>
          <path d="M 83 98 C 73 76 82 52 96 62 C 100 76 96 92 92 99 Z" fill="#fca5a5"/>
        </g>

        <!-- Правое ухо -->
        <g id="ear-right" style="transform-origin: 210px 115px; transition: transform 0.3s ease;">
          <path d="M 228 115 C 250 70 230 18 198 38 C 185 70 192 105 202 118 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 222 105 C 236 74 224 38 202 52 C 195 72 200 96 206 106 Z" fill="#5a6273"/>
          <path d="M 217 98 C 227 76 218 52 204 62 C 200 76 204 92 208 99 Z" fill="#fca5a5"/>
        </g>

        <!-- Голова -->
        <path d="M 80 130 C 52 140 50 160 70 170 C 50 178 54 200 80 198 C 95 218 205 218 220 198 C 246 200 250 178 230 170 C 250 160 248 140 220 130 C 225 80 75 80 80 130 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="5" stroke-linejoin="round"/>

        <!-- Светлая маска сердечком -->
        <path d="M 98 145 C 80 165 90 195 120 195 C 135 195 145 186 150 182 C 155 186 165 195 180 195 C 210 195 220 165 202 145 C 190 130 160 135 150 148 C 140 135 110 130 98 145 Z" fill="#ffffff" stroke="#363d4e" stroke-width="4"/>

        <!-- Чубчик-завиток -->
        <path d="M 135 78 C 120 62 140 38 160 45 C 172 50 170 65 158 68 C 168 64 175 72 165 82 C 152 86 142 84 135 78 Z" fill="#b8c0cc" stroke="#363d4e" stroke-width="4.5" stroke-linejoin="round"/>

        <!-- Румянец базовый -->
        <g stroke="#f87171" stroke-width="3" stroke-linecap="round">
          <line x1="96" y1="172" x2="102" y2="180" />
          <line x1="104" y1="172" x2="110" y2="180" />
          <line x1="190" y1="172" x2="196" y2="180" />
          <line x1="198" y1="172" x2="204" y2="180" />
        </g>

        <!-- Бровки -->
        <g id="brow-left" style="transform-origin: 118px 126px; transition: transform 0.3s ease;">
          <ellipse cx="118" cy="126" rx="6" ry="3.5" fill="#788194"/>
        </g>
        <g id="brow-right" style="transform-origin: 182px 126px; transition: transform 0.3s ease;">
          <ellipse cx="182" cy="126" rx="6" ry="3.5" fill="#788194"/>
        </g>

        <!-- Глаза -->
        <g id="jam-eyes">
          <g class="eye-round">
            <ellipse cx="118" cy="148" rx="14" ry="17" fill="#181a20"/>
            <circle cx="114" cy="142" r="6" fill="#ffffff"/>
            <circle cx="123" cy="156" r="2.8" fill="#ffffff"/>
            <ellipse cx="182" cy="148" rx="14" ry="17" fill="#181a20"/>
            <circle cx="178" cy="142" r="6" fill="#ffffff"/>
            <circle cx="187" cy="156" r="2.8" fill="#ffffff"/>
          </g>
          <path class="eye-sleep" d="M 106 150 Q 118 162 130 150 M 170 150 Q 182 162 194 150" stroke="#181a20" stroke-width="4.5" stroke-linecap="round" fill="none" style="display: none;"/>
        </g>

        <!-- Носик -->
        <ellipse cx="150" cy="165" rx="8" ry="6.5" fill="#1e222b"/>

        <!-- Ротик закрытый -->
        <path id="mouth-closed-path" d="M 140 172 Q 145 178 150 173 Q 155 178 160 172" stroke="#1e222b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

        <!-- Ротик открытый (анимируется) -->
        <path id="mouth-open-path" d="M 140 172 Q 150 192 160 172 Z" fill="#e11d48" stroke="#1e222b" stroke-width="3" style="display: none;"/>

        <!-- === Оверлеи спецэффектов и эмоций === -->
        
        <!-- Сэндвич (кушает) -->
        <g id="jam-sandwich" style="display: none;">
          <polygon points="120,240 180,240 150,205" fill="#facc15" stroke="#363d4e" stroke-width="3.5"/>
          <line x1="126" y1="237" x2="174" y2="237" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
          <line x1="130" y1="231" x2="170" y2="231" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
          <!-- Крошки -->
          <circle cx="120" cy="250" r="2" fill="#facc15"/>
          <circle cx="178" cy="248" r="2.5" fill="#facc15"/>
        </g>

        <!-- Слезинка (обиделся/грустит) -->
        <g id="fx-tear" style="display: none;">
          <ellipse cx="198" cy="162" rx="4" ry="6" fill="#38bdf8"/>
        </g>

        <!-- Пар гнева (злится) -->
        <g id="fx-anger" style="display: none;">
          <path d="M 60 70 Q 50 60 65 50" stroke="#f87171" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M 240 70 Q 250 60 235 50" stroke="#f87171" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>

        <!-- Пылающий румянец (смущается) -->
        <g id="fx-blush" style="display: none;">
          <ellipse cx="102" cy="175" rx="14" ry="7" fill="#fb7185" opacity="0.6"/>
          <ellipse cx="198" cy="175" rx="14" ry="7" fill="#fb7185" opacity="0.6"/>
        </g>

        <!-- Ноты танца -->
        <text id="fx-notes" x="30" y="90" font-size="28" style="display: none;">🎵✨</text>

        <!-- Сонные Zzz -->
        <text id="fx-zzz" x="220" y="80" font-size="26" font-weight="900" fill="#7aa2f7" style="display: none;">Zzz...</text>
      </svg>
    </div>

    <div class="status-text" id="statusText">Привет! Я Джем 🐾</div>
    <div class="chat-bubble" id="chatBubble">Нажми на микрофон, чтобы поговорить со мной!</div>
  </main>

  <footer class="controls">
    <button class="mic-button" id="micBtn" onclick="handleMicClick()">🎤</button>
    <div class="mic-hint" id="micHint">Нажми и говори</div>
  </footer>

  <!-- Настройки -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Настройки Джема</h2>

      <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="apiKeyInput" class="form-control" placeholder="Вставьте ваш API-ключ">
      </div>

      <div class="form-group">
        <label>Голос озвучки (Онлайн Нейросеть / Системный):</label>
        <select id="voiceSelect" class="form-control">
          <option value="neural_female">Онлайн: Светлана (Нейросеть, мягкий)</option>
          <option value="neural_male">Онлайн: Дмитрий (Нейросеть, живой)</option>
          <option value="system">Системный синтезатор телефона</option>
        </select>
      </div>

      <div class="form-group">
        <label>Высота голоса (тональность чиби): <span id="pitchVal">1.15</span></label>
        <div class="range-wrap">
          <input type="range" id="pitchInput" min="0.8" max="1.6" step="0.05" value="1.15" oninput="updatePitchVal(this.value)">
        </div>
      </div>

      <div class="form-group">
        <label>Скорость речи: <span id="rateVal">1.0</span></label>
        <div class="range-wrap">
          <input type="range" id="rateInput" min="0.8" max="1.3" step="0.05" value="1.0" oninput="updateRateVal(this.value)">
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-test" onclick="testVoice()">Тест голоса</button>
        <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
        <button class="btn btn-close" onclick="closeSettings()">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    let isListening = false;
    let autoMode = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let audioPlayer = new Audio();
    
    // Надежный таймер на временных метках
    let lastUserActionTime = Date.now();
    let idleLoop = null;
    let currentEmotion = 'idle';

    // Сохраняем оригинальные формы рта
    const MOUTH_CLOSED_DEFAULT = "M 140 172 Q 145 178 150 173 Q 155 178 160 172";
    const MOUTH_OPEN_DEFAULT = "M 140 172 Q 150 192 160 172 Z";
    const MOUTH_ANGRY = "M 140 176 L 160 176 L 150 186 Z";
    const MOUTH_SAD = "M 142 178 Q 150 170 158 178";

    const mascotBox = document.getElementById('mascotBox');
    const statusText = document.getElementById('statusText');
    const chatBubble = document.getElementById('chatBubble');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const autoModeBtn = document.getElementById('autoModeBtn');

    const emotionLabels = {
      idle: 'Привет! Я Джем 🐾',
      listening: 'Джем слушает ушком 🐾',
      thinking: 'Джем соображает...',
      speaking: 'Джем говорит...',
      angry: 'Джем злится! 💢',
      sad: 'Джем грустит 😢',
      blushing: 'Джем смущается 😳',
      eating: 'Джем жуёт сэндвич 🥪',
      dancing: 'Джем танцует ✨🐾',
      sleeping: 'Джем сладко спит... 💤'
    };

    // 1. Моргание
    setInterval(() => {
      if (mascotBox.classList.contains('idle') || mascotBox.classList.contains('blushing')) {
        mascotBox.classList.add('blinking');
        setTimeout(() => mascotBox.classList.remove('blinking'), 150);
      }
    }, 3800);

    // 2. Сброс и проверка таймера бездействия
    function resetActivity() {
      lastUserActionTime = Date.now();
      if (!['speaking', 'listening', 'thinking'].includes(currentEmotion)) {
        setMascotEmotion('idle');
      }
    }

    function checkIdleState() {
      // Не меняем состояние во время активных действий
      if (isListening || 
          (synth && synth.speaking) || 
          !audioPlayer.paused || 
          currentEmotion === 'thinking' ||
          currentEmotion === 'speaking' ||
          currentEmotion === 'listening') {
        lastUserActionTime = Date.now();
        return;
      }

      const elapsed = Math.floor((Date.now() - lastUserActionTime) / 1000);

      if (elapsed >= 75) {
        if (currentEmotion !== 'sleeping') {
          setMascotEmotion('sleeping');
          chatBubble.innerText = 'Снится сахарная косточка...';
        }
      } else if (elapsed >= 50) {
        if (currentEmotion !== 'dancing') {
          setMascotEmotion('dancing');
          chatBubble.innerText = 'Лапками топ-топ! Танцуем!';
        }
      } else if (elapsed >= 25) {
        if (currentEmotion !== 'eating') {
          setMascotEmotion('eating');
          chatBubble.innerText = 'Хрум-хрум! Очень вкусный сэндвич!';
        }
      } else if (elapsed >= 12) {
        if (currentEmotion !== 'idle') {
          setMascotEmotion('idle');
          statusText.innerText = 'Джем скучает...';
        }
      }
    }

    // Запускаем idle-цикл
    if (idleLoop) clearInterval(idleLoop);
    idleLoop = setInterval(checkIdleState, 1000);

    // Управление эмоциями Джема
    function setMascotEmotion(emotionClass, customLabel = null) {
      currentEmotion = emotionClass;

      // Скрываем все оверлеи
      const overlays = ['fx-tear', 'fx-anger', 'fx-blush', 'fx-notes', 'fx-zzz', 'jam-sandwich'];
      overlays.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
      
      const eyeSleep = document.querySelector('.eye-sleep');
      if (eyeSleep) eyeSleep.style.display = 'none';

      // Восстанавливаем стандартные формы рта
      const mouthClosed = document.getElementById('mouth-closed-path');
      const mouthOpen = document.getElementById('mouth-open-path');
      
      if (mouthClosed) {
        mouthClosed.setAttribute('d', MOUTH_CLOSED_DEFAULT);
        mouthClosed.style.display = '';
      }
      if (mouthOpen) {
        mouthOpen.setAttribute('d', MOUTH_OPEN_DEFAULT);
        mouthOpen.style.display = 'none';
        mouthOpen.style.fill = '#e11d48';
      }

      // Специальные формы рта
      if (emotionClass === 'angry') {
        if (mouthOpen) {
          mouthOpen.setAttribute('d', MOUTH_ANGRY);
          mouthOpen.style.display = 'block';
          mouthOpen.style.fill = '#ef4444';
        }
        if (mouthClosed) mouthClosed.style.display = 'none';
      } else if (emotionClass === 'sad') {
        if (mouthClosed) {
          mouthClosed.setAttribute('d', MOUTH_SAD);
        }
      }

      // Применяем класс
      mascotBox.className = 'mascot-box ' + emotionClass;
      
      // Статус
      statusText.innerText = customLabel || emotionLabels[emotionClass] || 'Джем 🐾';
    }

    // Автоматическое определение эмоции из ответа
    function detectEmotion(text) {
      const lower = text.toLowerCase();
      if (/зл(ю|и|е)|бес(и|ит)|фу|отстань|хватит|ужас|бесит|раздражает/.test(lower)) return 'angry';
      if (/груст|обид|жаль|печал|эх|плач|слез|тоск|одинок/.test(lower)) return 'sad';
      if (/смущ|красне|ой|мило|приятно|засмущ|стесня|милота/.test(lower)) return 'blushing';
      return 'idle';
    }

    // 3. Загрузка настроек
    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    const savedVoiceMode = localStorage.getItem('jam_voice_mode') || 'neural_female';
    document.getElementById('voiceSelect').value = savedVoiceMode;

    const savedPitch = localStorage.getItem('jam_pitch') || '1.15';
    const savedRate = localStorage.getItem('jam_rate') || '1.0';
    document.getElementById('pitchInput').value = savedPitch;
    document.getElementById('pitchVal').innerText = savedPitch;
    document.getElementById('rateInput').value = savedRate;
    document.getElementById('rateVal').innerText = savedRate;

    // 4. Микрофон
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        resetActivity();
        isListening = true;
        micBtn.classList.add('active');
        micHint.innerText = 'Слушаю тебя...';
        setMascotEmotion('listening');
      };

      recognition.onresult = (e) => {
        resetActivity();
        const text = e.results[0][0].transcript;
        chatBubble.innerText = 'Ты: ' + text;
        processUserQuery(text);
      };

      recognition.onerror = (event) => {
        stopListening();
        
        let errorMsg = 'Ошибка распознавания';
        switch(event.error) {
          case 'no-speech':
            errorMsg = 'Я ничего не услышал... Попробуй ещё раз';
            break;
          case 'audio-capture':
            errorMsg = 'Нет доступа к микрофону';
            break;
          case 'not-allowed':
            errorMsg = 'Разреши доступ к микрофону в браузере';
            break;
          case 'network':
            errorMsg = 'Проблемы с сетью';
            break;
          default:
            errorMsg = 'Что-то пошло не так с микрофоном';
        }
        
        chatBubble.innerText = errorMsg;
        setMascotEmotion('idle');
        micHint.innerText = 'Нажми и говори';
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      micHint.innerText = 'Микрофон не поддерживается браузером';
    }

    function handleMicClick() {
      resetActivity();
      if (!recognition) {
        alert('Открой сайт через Chrome на телефоне!');
        return;
      }
      
      // Останавливаем текущую речь
      if (synth && synth.speaking) synth.cancel();
      if (!audioPlayer.paused) {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      }

      if (isListening) {
        try {
          recognition.stop();
        } catch(e) {}
      } else {
        try {
          recognition.start();
        } catch(err) {
          console.log('Recognition start error:', err);
          // Иногда нужно пересоздать
          if (err.name === 'InvalidStateError') {
            recognition.stop();
            setTimeout(() => {
              try { recognition.start(); } catch(e) {}
            }, 300);
          }
        }
      }
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('active');
      if (!autoMode) {
        micHint.innerText = 'Нажми и говори';
      }
    }

    // Очистка текста от эмодзи, звездочек и скобок
    function sanitizeForSpeech(rawText) {
      if (!rawText) return '';
      return rawText
        .replace(/\*[^*]*\*/g, '')                            // *действия*
        .replace(/\([^\)]*\)/g, '')                            // (скобки)
        .replace(/\[[^\]]*\]/g, '')                            // [скобки]
        .replace(/[\p{Extended_Pictographic}\uFE0F]/gu, '')    // эмодзи
        .replace(/[*_#~`]/g, '')                               // маркдаун
        .replace(/\s+/g, ' ')
        .trim();
    }

    // 5. Запрос к Gemini 3.6 Flash
    async function processUserQuery(query) {
      resetActivity();
      setMascotEmotion('thinking');
      
      const apiKey = localStorage.getItem('gemini_api_key');

      if (!apiKey) {
        setTimeout(() => {
          speakResponse("Я тебя отлично слышу! Но чтобы я стал сообразительным чиби-волчонком, добавь свой ключик в шестерёнку наверху!");
        }, 600);
        return;
      }

      try {
        const systemInstruction = "Ты — Джем, маленький чиби-волчонок в черной футболке с логотипом Gemini. Ты общаешься голосом вслух! КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО использовать звездочки, описывать действия, эмоции, вставлять эмодзи или скобки. Говори только живым текстом от первого лица, весело, лаконично (1-2 емких предложения).";

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: {
                parts: [{ text: systemInstruction }]
              },
              contents: [
                { role: "user", parts: [{ text: query }] }
              ],
              generationConfig: {
                maxOutputTokens: 180,
                temperature: 0.9
              }
            })
          }
        );

        const data = await response.json();

        if (data.error) {
          console.error('Gemini error:', data.error);
          speakResponse("Ой! Ошибка Gemini: " + (data.error.message || "проверь ключ"));
          return;
        }

        if (data.candidates && data.candidates[0] && data.candidates[0].content) {
          const rawReply = data.candidates[0].content.parts[0].text || '';
          const cleanReply = sanitizeForSpeech(rawReply);
          const emotion = detectEmotion(rawReply);
          speakResponse(cleanReply || rawReply, emotion);
        } else {
          speakResponse("Не удалось разобрать ответ от космоса.");
        }
      } catch (err) {
        console.error('Network error:', err);
        speakResponse("Не могу связаться с Gemini. Проверь сеть или VPN!");
      }
    }

    // 6. Озвучка ответа
    function speakResponse(text, targetEmotion = 'idle') {
      resetActivity();
      const speakText = sanitizeForSpeech(text);
      if (!speakText) {
        setMascotEmotion(targetEmotion);
        return;
      }

      chatBubble.innerText = speakText;
      setMascotEmotion('speaking');

      const voiceMode = localStorage.getItem('jam_voice_mode') || 'neural_female';

      const onSpeakFinished = () => {
        setMascotEmotion(targetEmotion);
        resetActivity();
        checkAutoMode();
      };

      if (voiceMode.startsWith('neural')) {
        const voiceName = voiceMode === 'neural_female' ? 'ru-RU-SvetlanaNeural' : 'ru-RU-DmitryNeural';
        const encodedText = encodeURIComponent(speakText);
        const ttsUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voiceName}&text=${encodedText}`;

        // Останавливаем предыдущее воспроизведение
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        
        audioPlayer.src = ttsUrl;
        audioPlayer.playbackRate = parseFloat(localStorage.getItem('jam_rate') || '1.0');

        audioPlayer.onended = onSpeakFinished;
        audioPlayer.onerror = () => {
          console.warn('StreamElements TTS failed, falling back to system voice');
          fallbackSystemSpeak(speakText, onSpeakFinished);
        };
        
        audioPlayer.play().catch((err) => {
          console.warn('Play failed:', err);
          fallbackSystemSpeak(speakText, onSpeakFinished);
        });
      } else {
        fallbackSystemSpeak(speakText, onSpeakFinished);
      }
    }

    function fallbackSystemSpeak(text, callback) {
      if (!synth) {
        if (callback) callback();
        return;
      }
      
      synth.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.pitch = parseFloat(localStorage.getItem('jam_pitch') || '1.15');
      utterance.rate = parseFloat(localStorage.getItem('jam_rate') || '1.0');

      utterance.onend = () => { if (callback) callback(); };
      utterance.onerror = () => { if (callback) callback(); };
      
      synth.speak(utterance);
    }

    function checkAutoMode() {
      if (autoMode) {
        setTimeout(() => {
          if (recognition && !isListening && currentEmotion !== 'speaking') {
            try { 
              recognition.start(); 
            } catch(e) {
              console.log('Auto start failed:', e);
            }
          }
        }, 700);
      }
    }

    function toggleAutoMode() {
      resetActivity();
      autoMode = !autoMode;
      
      if (autoMode) {
        autoModeBtn.classList.add('active');
        micHint.innerText = 'Авто-режим включён';
        
        if (!isListening && 
            (!synth || !synth.speaking) && 
            audioPlayer.paused) {
          handleMicClick();
        }
      } else {
        autoModeBtn.classList.remove('active');
        micHint.innerText = 'Нажми и говори';
        if (isListening) {
          try { recognition.stop(); } catch(e) {}
        }
      }
    }

    // Меню настроек
    function openSettings() {
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function updatePitchVal(v) {
      document.getElementById('pitchVal').innerText = v;
    }

    function updateRateVal(v) {
      document.getElementById('rateVal').innerText = v;
    }

    function testVoice() {
      speakResponse("Привет! Я чиби-волчонок Джем, проверяю свой живой голосок!");
    }

    function saveSettings() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const voiceMode = document.getElementById('voiceSelect').value;
      const pitch = document.getElementById('pitchInput').value;
      const rate = document.getElementById('rateInput').value;

      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('jam_voice_mode', voiceMode);
      localStorage.setItem('jam_pitch', pitch);
      localStorage.setItem('jam_rate', rate);

      closeSettings();
      resetActivity();
      
      // Небольшой фидбек
      chatBubble.innerText = 'Настройки сохранены! ✨';
      setTimeout(() => {
        if (currentEmotion === 'idle') {
          chatBubble.innerText = 'Нажми на микрофон, чтобы поговорить со мной!';
        }
      }, 1800);
    }

    // Разбудить Джема при любом клике по экрану (кроме кнопок)
    document.addEventListener('click', (e) => {
      if (currentEmotion === 'sleeping' && 
          !e.target.closest('.mic-button') && 
          !e.target.closest('.icon-btn') &&
          !e.target.closest('.auto-toggle') &&
          !e.target.closest('.modal')) {
        resetActivity();
        setMascotEmotion('idle');
        chatBubble.innerText = 'Ой! Ты меня разбудил...';
      }
    });
  </script>
</body>
  </html>
