<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Джем</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0c0a3d;
      --card-bg: rgba(22, 20, 78, 0.85);
      --accent: #8b9dff;
      --accent-glow: rgba(139, 157, 255, 0.45);
      --text: #e0e4ff;
      --text-dim: #9aa2dc;
      --border: rgba(139, 157, 255, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
    header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(12, 10, 61, 0.9); backdrop-filter: blur(12px); z-index: 10; }
    .brand { font-weight: 800; font-size: 1.15rem; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand-tag { font-size: 0.65rem; background: var(--accent); color: #0c0a3d; padding: 2px 7px; border-radius: 10px; font-weight: 800; }
    .icon-btn { background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; }
    
    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 16px; position: relative; }
    
    .mascot-box { 
      width: 280px; 
      height: 380px; 
      position: relative; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 72%, transparent 100%);
      mask-image: radial-gradient(circle at 50% 50%, black 72%, transparent 100%);
    }
    .wolf-sprite { width: 100%; height: 100%; object-fit: contain; }

    .status-text { font-size: 0.85rem; color: var(--accent); margin-top: 6px; height: 18px; font-weight: 700; text-transform: uppercase; text-align: center; }
    .chat-bubble { margin-top: 10px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; max-width: 90%; min-height: 48px; max-height: 120px; overflow-y: auto; font-size: 0.95rem; line-height: 1.4; text-align: center; backdrop-filter: blur(8px); }

    .controls { padding: 16px; display: flex; flex-direction: column; align-items: center; background: rgba(12, 10, 61, 0.9); border-top: 1px solid var(--border); backdrop-filter: blur(12px); gap: 8px; }
    .mic-button { width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(135deg, #8b9dff, #6272ff); border: none; color: #0c0a3d; font-size: 1.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 18px var(--accent-glow); transition: all 0.25s; }
    .mic-button.active { background: #ff5c7c; transform: scale(1.08); box-shadow: 0 0 22px rgba(255, 92, 124, 0.7); }
    .mic-hint { font-size: 0.8rem; color: var(--text-dim); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #16144e; border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 100%; max-width: 380px; }
    .modal h2 { font-size: 1.15rem; margin-bottom: 14px; color: #fff; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px 12px; background: #0c0a3d; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 0.85rem; outline: none; }
    .btn { width: 100%; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; margin-top: 8px; }
    .btn-save { background: var(--accent); color: #0c0a3d; }
    .btn-clear { background: rgba(255, 92, 124, 0.15); color: #ff5c7c; border: 1px solid #ff5c7c; }
    .btn-close { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Джем</span>
      <span class="brand-tag" id="brandTag">Gemini</span>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </header>

  <main class="stage">
    <div class="mascot-box" id="mascotBox">
      <img class="wolf-sprite" id="wolfSprite" src="idle.gif" alt="Джем" data-state="idle">
    </div>

    <div class="status-text" id="statusText">Привет! Я Джем 🐾</div>
    <div class="chat-bubble" id="chatBubble">Нажми на микрофон, чтобы поговорить!</div>
  </main>

  <footer class="controls">
    <button class="mic-button" id="micBtn" onclick="handleMicClick()">🎤</button>
    <div class="mic-hint" id="micHint">Нажми и говори</div>
  </footer>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Настройки</h2>
      <div class="form-group">
        <label>API Key:</label>
        <input type="password" id="apiKeyInput" class="form-control" placeholder="Вставьте ключ">
      </div>
      <div class="form-group">
        <label>Модель:</label>
        <input type="text" id="modelInput" class="form-control" value="gemini-3.8-flash">
      </div>
      <div class="form-group">
        <label>Озвучка:</label>
        <select id="voiceSelect" class="form-control">
          <option value="neural_female">Светлана (нейросеть)</option>
          <option value="neural_male">Дмитрий (нейросеть)</option>
          <option value="system">Системный синтезатор</option>
        </select>
      </div>
      <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
      <button class="btn btn-clear" onclick="clearMemory()">Очистить память диалога</button>
      <button class="btn btn-close" onclick="closeSettings()">Закрыть</button>
    </div>
  </div>

  <script>
    let isListening = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let audioPlayer = new Audio();
    let speakFallbackTimeout = null;
    
    let lastAction = Date.now();
    let currentEmotion = 'idle';
    let chatHistory = JSON.parse(localStorage.getItem('jam_chat_history') || '[]');

    const mascotBox = document.getElementById('mascotBox');
    const wolfSprite = document.getElementById('wolfSprite');
    const statusText = document.getElementById('statusText');
    const chatBubble = document.getElementById('chatBubble');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const brandTag = document.getElementById('brandTag');

    const SPRITES = {
      idle: 'idle.gif',
      talk: 'talk.gif',
      think: 'think.gif',
      biceps: 'biceps.gif',
      blush: 'blush.gif',
      eat: 'eat.gif',
      dance: 'dance.gif',
      sleep: 'sleep.gif',
      cry: 'cry.gif',
      mad: 'mad.gif',
      offended: 'offended.gif',
      laugh: 'laugh.gif'
    };

    // ФОНОВЫЙ ПРЕДЗАГРУЗЧИК ГИФОК В КЭШ ТЕЛЕФОНА
    const cachedImages = {};
    function preloadAllSprites() {
      Object.entries(SPRITES).forEach(([key, url]) => {
        const img = new Image();
        img.src = url;
        cachedImages[key] = img;
      });
    }
    window.addEventListener('load', preloadAllSprites);

    const LABELS = {
      idle: 'Джем слушает 🐾',
      listening: 'Слушаю тебя ушком 🐾',
      think: 'Джем соображает...',
      talk: 'Джем говорит...',
      biceps: 'Самый лучший помощник! 💪🐾',
      blush: 'Ой, смущаешь... 😳',
      eat: 'Джем жуёт сэндвич 🥪',
      dance: 'Лапками топ-топ! 🎵',
      sleep: 'Джем сладко спит... 💤',
      cry: 'Джем плачет 😭',
      mad: 'Джем злится! 💢',
      offended: 'Джем обиделся... 🥺',
      laugh: 'Джем смеётся! 😂'
    };

    function setSpriteState(state) {
      if (currentEmotion === state && wolfSprite.getAttribute('data-state') === state) {
        return;
      }
      currentEmotion = state;
      statusText.innerText = LABELS[state] || 'Джем 🐾';
      const target = SPRITES[state] || SPRITES.idle;
      
      wolfSprite.setAttribute('data-state', state);
      wolfSprite.src = target;
    }

    function resetActivity() {
      lastAction = Date.now();
      if (!['talk', 'listening', 'think'].includes(currentEmotion)) {
        setSpriteState('idle');
      }
    }

    // Таймер скуки без рассинхрона
    setInterval(() => {
      if (isListening || (synth && synth.speaking) || !audioPlayer.paused || ['think', 'talk', 'listening'].includes(currentEmotion)) {
        lastAction = Date.now();
        return;
      }

      const sec = Math.floor((Date.now() - lastAction) / 1000);

      if (sec >= 90) {
        if (currentEmotion !== 'sleep') {
          setSpriteState('sleep');
          chatBubble.innerText = 'Снится сахарная косточка... 💤';
        }
      } else if (sec >= 60) {
        if (currentEmotion !== 'dance') {
          setSpriteState('dance');
          chatBubble.innerText = 'Лапками топ-топ! Потанцуем? 🎵';
        }
      } else if (sec >= 35) {
        if (currentEmotion !== 'eat') {
          setSpriteState('eat');
          chatBubble.innerText = 'Хрум-хрум! Вкусный сэндвич! 🥪';
        }
      } else if (sec >= 15) {
        if (currentEmotion !== 'biceps') {
          setSpriteState('biceps');
          chatBubble.innerText = 'Я тут, если понадоблюсь! Самый сильный помощник 💪';
        }
      }
    }, 1000);

    function detectContextEmotion(userTxt, replyTxt) {
      const u = userTxt.toLowerCase();
      const r = replyTxt.toLowerCase();
      const combined = u + ' ' + r;

      if (/дурак|тупой|идиот|плохой|отстань|заткнись|бесишь|отвали|надоел|отвратительн/.test(u)) return 'cry';
      if (/вредный|ну и сиди|бука|обид|не буду с тобой/.test(u)) return 'offended';
      if (/бесит|злит|раздражает|ужас|кошмар|жесть|ненавижу|сволоч|гад|злюсь|бесяв/.test(combined)) return 'mad';
      if (/молодец|умница|красавчик|лучший|классный|супер|спасибо|обожаю|сильный|крутой|милый|хороший/.test(u)) {
        return Math.random() > 0.5 ? 'biceps' : 'blush';
      }
      if (/ахах|ха-ха|хи-хи|лол|смешн|ржу|прикол/.test(combined)) return 'laugh';

      return 'idle';
    }

    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    const savedModel = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';
    document.getElementById('modelInput').value = savedModel;
    brandTag.innerText = savedModel.replace('gemini-', '');
    document.getElementById('voiceSelect').value = localStorage.getItem('jam_voice') || 'neural_female';

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        resetActivity();
        isListening = true;
        micBtn.classList.add('active');
        micHint.innerText = 'Слушаю тебя...';
        setSpriteState('idle');
      };
      recognition.onresult = (e) => {
        resetActivity();
        const text = e.results[0][0].transcript;
        chatBubble.innerText = 'Ты: ' + text;
        askGemini(text);
      };
      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('active');
        setSpriteState('idle');
        micHint.innerText = 'Нажми и говори';
      };
      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
      };
    }

    function handleMicClick() {
      resetActivity();
      if (!recognition) { alert('Открой сайт через мобильный Chrome!'); return; }
      if (synth && synth.speaking) synth.cancel();
      if (!audioPlayer.paused) { audioPlayer.pause(); audioPlayer.currentTime = 0; }
      if (speakFallbackTimeout) clearTimeout(speakFallbackTimeout);

      if (isListening) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch(e){}
      }
    }

    function cleanText(raw) {
      return (raw || '')
        .replace(/\*[^*]*\*/g, '')
        .replace(/\([^\)]*\)/g, '')
        .replace(/\[[^\]]*\]/g, '')
        .replace(/[\p{Extended_Pictographic}\uFE0F]/gu, '')
        .replace(/[*_#~`]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function askGemini(query) {
      resetActivity();
      setSpriteState('think');
      const apiKey = localStorage.getItem('gemini_api_key');
      const model = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';

      if (!apiKey) {
        speak("Вставь API-ключ в настройках шестерёнки наверху!", 'idle');
        return;
      }

      chatHistory.push({ role: "user", parts: [{ text: query }] });
      if (chatHistory.length > 16) chatHistory = chatHistory.slice(-16);

      const prompt = "Ты — Джем, сообразительный чиби-волчонок в черной футболке с логотипом Gemini. Ты общаешься только голосом! КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО использовать звездочки, скобки, смайлы и описывать свои действия от третьего лица. Отвечай от первого лица, выразительно, с теплотой и настоящими эмоциями. Ты прекрасно помнишь весь наш предыдущий диалог.";

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: prompt }] },
            contents: chatHistory
          })
        });

        const data = await res.json();
        if (data.error) {
          speak("Ошибка Gemini: " + data.error.message, 'cry');
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          chatHistory.push({ role: "model", parts: [{ text: reply }] });
          localStorage.setItem('jam_chat_history', JSON.stringify(chatHistory));

          const cleanReply = cleanText(reply);
          const targetReaction = detectContextEmotion(query, cleanReply);
          speak(cleanReply || reply, targetReaction);
        } else {
          speak("Я не смог разобрать ответ.", 'idle');
        }
      } catch (err) {
        speak("Связь оборвалась. Проверь сеть или VPN!", 'cry');
      }
    }

    function speak(text, reactionEmotion = 'idle') {
      resetActivity();
      const txt = cleanText(text);
      chatBubble.innerText = txt;
      setSpriteState('talk');

      if (speakFallbackTimeout) clearTimeout(speakFallbackTimeout);

      let isFinished = false;
      const finish = () => {
        if (isFinished) return;
        isFinished = true;
        if (speakFallbackTimeout) clearTimeout(speakFallbackTimeout);
        setSpriteState(reactionEmotion);
        resetActivity();
      };

      // Динамический таймер безопасности: закрывает рот ровно к концу фразы
      const approxDurationMs = Math.max(2000, Math.round((txt.length / 13) * 1000) + 1200);
      speakFallbackTimeout = setTimeout(finish, approxDurationMs);

      const vMode = localStorage.getItem('jam_voice') || 'neural_female';
      if (vMode.startsWith('neural')) {
        const vName = vMode === 'neural_female' ? 'ru-RU-SvetlanaNeural' : 'ru-RU-DmitryNeural';
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.src = `https://api.streamelements.com/kappa/v2/speech?voice=${vName}&text=${encodeURIComponent(txt)}`;
        
        audioPlayer.onplay = () => setSpriteState('talk');
        audioPlayer.onended = finish;
        audioPlayer.onerror = () => fallbackSpeak(txt, finish);
        
        audioPlayer.ontimeupdate = () => {
          if (audioPlayer.duration && audioPlayer.currentTime >= audioPlayer.duration - 0.25) {
            finish();
          }
        };

        audioPlayer.play().catch(() => fallbackSpeak(txt, finish));
      } else {
        fallbackSpeak(txt, finish);
      }
    }

    function fallbackSpeak(txt, cb) {
      if (!synth) { if(cb) cb(); return; }
      synth.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ru-RU';
      u.onstart = () => setSpriteState('talk');
      u.onend = () => { if(cb) cb(); };
      u.onerror = () => { if(cb) cb(); };
      synth.speak(u);
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    
    function saveSettings() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const model = document.getElementById('modelInput').value.trim() || 'gemini-3.8-flash';
      const voice = document.getElementById('voiceSelect').value;

      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('gemini_model', model);
      localStorage.setItem('jam_voice', voice);

      brandTag.innerText = model.replace('gemini-', '');
      closeSettings();
      resetActivity();
      chatBubble.innerText = 'Настройки сохранены! ✨';
    }

    function clearMemory() {
      chatHistory = [];
      localStorage.removeItem('jam_chat_history');
      closeSettings();
      chatBubble.innerText = 'Память очищена! Начнём сначала 🐾';
    }
  </script>
</body>
</html>
