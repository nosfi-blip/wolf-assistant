<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Джем</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let reg of regs) reg.update();
      });
      if ('caches' in window) {
        caches.keys().then(names => {
          for (let name of names) caches.delete(name);
        });
      }
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
  <style>
    :root {
      --bg: #0c0a3d;
      --card-bg: rgba(22, 20, 78, 0.85);
      --accent: #8b9dff;
      --accent-glow: rgba(139, 157, 255, 0.45);
      --text: #e0e4ff;
      --text-dim: #9aa2dc;
      --border: rgba(139, 157, 255, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; user-select: none; }
    header { flex-shrink: 0; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(12, 10, 61, 0.9); backdrop-filter: blur(12px); z-index: 10; }
    .brand { font-weight: 800; font-size: 1.15rem; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand-tag { font-size: 0.65rem; background: var(--accent); color: #0c0a3d; padding: 2px 7px; border-radius: 10px; font-weight: 800; }
    .icon-btn { background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; padding: 6px; }
    
    .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 16px; position: relative; }
    
    .mascot-box { 
      width: 220px; 
      height: 250px; 
      max-height: 36vh;
      position: relative; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .wolf-sprite { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

    .status-text { font-size: 0.8rem; color: var(--accent); margin-top: 4px; height: 18px; font-weight: 700; text-transform: uppercase; text-align: center; flex-shrink: 0; }
    .chat-bubble { margin-top: 6px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 10px 14px; width: 94%; min-height: 44px; max-height: 105px; overflow-y: auto; font-size: 0.9rem; line-height: 1.35; text-align: center; backdrop-filter: blur(8px); transition: all 0.3s ease; flex-shrink: 0; user-select: text; }

    .controls { flex-shrink: 0; padding: 10px 16px 14px; display: flex; flex-direction: column; align-items: center; background: rgba(12, 10, 61, 0.95); border-top: 1px solid var(--border); backdrop-filter: blur(12px); gap: 10px; z-index: 10; }
    
    .text-input-row { display: flex; width: 100%; max-width: 420px; gap: 8px; }
    .chat-input { flex: 1; padding: 10px 14px; background: #16144e; border: 1px solid var(--border); border-radius: 20px; color: #fff; font-size: 0.9rem; outline: none; user-select: text; }
    .chat-input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(139, 157, 255, 0.25); }
    .chat-input::placeholder { color: var(--text-dim); }
    .send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); border: none; color: #0c0a3d; font-size: 1.1rem; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; transition: transform 0.15s; }
    .send-btn:active { transform: scale(0.92); }

    .voice-controls-row { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 420px; padding: 0 4px; }
    
    .auto-listen-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #16144e; border: 1px solid var(--border); transition: .25s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-dim); transition: .25s; border-radius: 50%; }
    input:checked + .slider { background-color: rgba(139, 157, 255, 0.25); border-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); background-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
    .toggle-label { font-size: 0.78rem; color: var(--text-dim); line-height: 1.15; }
    .toggle-label.on { color: var(--accent); font-weight: 600; }

    .mic-wrap { display: flex; align-items: center; gap: 10px; }
    .mic-button { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #8b9dff, #6272ff); border: none; color: #0c0a3d; font-size: 1.5rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 16px var(--accent-glow); transition: all 0.25s; flex-shrink: 0; }
    .mic-button.active { background: #ff5c7c; transform: scale(1.08); box-shadow: 0 0 22px rgba(255, 92, 124, 0.7); }
    .mic-hint { font-size: 0.76rem; color: var(--text-dim); width: 95px; text-align: right; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #16144e; border: 1px solid var(--border); border-radius: 18px; padding: 18px; width: 100%; max-width: 390px; max-height: 92vh; overflow-y: auto; }
    .modal h2 { font-size: 1.1rem; margin-bottom: 12px; color: #fff; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 4px; }
    .form-control { width: 100%; padding: 9px 12px; background: #0c0a3d; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 0.85rem; outline: none; }
    
    /* Ряд с заблюренным ключом и его тумблером */
    .key-row { display: flex; align-items: center; gap: 10px; }
    .key-row .form-control { flex: 1; }

    .btn { width: 100%; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; margin-top: 7px; font-size: 0.88rem; }
    .btn-save { background: var(--accent); color: #0c0a3d; }
    .btn-clear { background: rgba(255, 92, 124, 0.15); color: #ff5c7c; border: 1px solid #ff5c7c; }
    .btn-close { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Джем</span>
      <span class="brand-tag" id="brandTag">Gemini</span>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </header>

  <main class="stage">
    <div class="mascot-box" id="mascotBox">
      <img class="wolf-sprite" id="wolfSprite" src="idle.gif" alt="Джем" data-state="idle">
    </div>

    <div class="status-text" id="statusText">Джем на связи 🐾</div>
    <div class="chat-bubble" id="chatBubble">Привет! Ну что, какие новости? Пиши в чат или жми микрофон, поболтаем!</div>
  </main>

  <footer class="controls">
    <div class="text-input-row">
      <input type="text" id="chatInput" class="chat-input" placeholder="Написать тихонько..." autocomplete="off">
      <button class="send-btn" id="sendBtn" onclick="handleTextSend()">➤</button>
    </div>

    <div class="voice-controls-row">
      <label class="auto-listen-wrap">
        <div class="switch">
          <input type="checkbox" id="autoListenToggle" onchange="toggleAutoListen(this.checked)">
          <span class="slider"></span>
        </div>
        <span class="toggle-label" id="autoListenLabel">Слушать<br>постоянно</span>
      </label>

      <div class="mic-wrap">
        <div class="mic-hint" id="micHint">Нажми и говори</div>
        <button class="mic-button" id="micBtn" onclick="handleMicClick()">🎤</button>
      </div>
    </div>
  </footer>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Настройки</h2>

      <div class="form-group">
        <label>API Ключ 1:</label>
        <div class="key-row">
          <input type="password" id="apiKey1" class="form-control" placeholder="Вставьте ключ 1">
          <label class="switch">
            <input type="checkbox" id="keyToggle1" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>API Ключ 2 (резервный):</label>
        <div class="key-row">
          <input type="password" id="apiKey2" class="form-control" placeholder="Вставьте ключ 2">
          <label class="switch">
            <input type="checkbox" id="keyToggle2" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>API Ключ 3 (резервный):</label>
        <div class="key-row">
          <input type="password" id="apiKey3" class="form-control" placeholder="Вставьте ключ 3">
          <label class="switch">
            <input type="checkbox" id="keyToggle3" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Модель:</label>
        <input type="text" id="modelInput" class="form-control" value="gemini-3.8-flash">
      </div>
      <div class="form-group">
        <label>Озвучка:</label>
        <select id="voiceSelect" class="form-control">
          <option value="Puck">Gemini: Puck (Дерзкий мужской)</option>
          <option value="Fenrir">Gemini: Fenrir (Глубокий волчий)</option>
          <option value="Charon">Gemini: Charon (Спокойный мужской)</option>
          <option value="Aoede">Gemini: Aoede (Живой женский)</option>
          <option value="Kore">Gemini: Kore (Мягкий женский)</option>
        </select>
      </div>
      <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
      <button class="btn btn-clear" onclick="clearMemory()">Очистить память диалога</button>
      <button class="btn btn-close" onclick="closeSettings()">Закрыть</button>
    </div>
  </div>

  <script>
    let isListening = false;
    let isThinking = false;
    let isSpeaking = false;
    let autoListen = localStorage.getItem('jam_auto_listen') === 'true';
    let manualStop = false;
    let recognition = null;
    
    let audioCtx = null;
    let currentSource = null;
    
    let lastAction = Date.now();
    let currentEmotion = 'idle';
    let chatHistory = JSON.parse(localStorage.getItem('jam_chat_history') || '[]');

    let tapCount = 0;
    let tapTimer = null;
    let tapResetTimeout = null;
    let postEmotionTimeout = null;
    let idleStage = 0;

    const mascotBox = document.getElementById('mascotBox');
    const wolfSprite = document.getElementById('wolfSprite');
    const statusText = document.getElementById('statusText');
    const chatBubble = document.getElementById('chatBubble');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const brandTag = document.getElementById('brandTag');
    const chatInput = document.getElementById('chatInput');
    const autoListenToggle = document.getElementById('autoListenToggle');
    const autoListenLabel = document.getElementById('autoListenLabel');

    const SPRITES = {
      idle: 'idle.gif', talk: 'talk.gif', think: 'think.gif', biceps: 'biceps.gif',
      blush: 'blush.gif', eat: 'eat.gif', dance: 'dance.gif', sleep: 'sleep.gif',
      cry: 'cry.gif', mad: 'mad.gif', offended: 'offended.gif', laugh: 'laugh.gif'
    };

    const LABELS = {
      idle: 'Джем слушает 🐾', listening: 'Слушаю тебя ушком 🐾', think: 'Джем соображает...',
      talk: 'Джем вещает...', biceps: 'Кто тут лучший? Я! 💪🐾', blush: 'Ой, смущаешь... 😳',
      eat: 'Время перекуса 🥪', dance: 'Флексим лапками! 🎵', sleep: 'Ушёл в спящий режим... 💤',
      cry: 'Ну и за что ты так? 😭', mad: 'Ух, разносим! 💢', offended: 'Всё, я в обиде 🥺', laugh: 'Ахаха, хорош! 😂'
    };

    const cachedImages = {};
    function preloadAllSprites() {
      Object.entries(SPRITES).forEach(([key, url]) => {
        const img = new Image();
        img.src = url;
        cachedImages[key] = img;
      });
    }
    window.addEventListener('load', preloadAllSprites);

    autoListenToggle.checked = autoListen;
    if (autoListen) autoListenLabel.classList.add('on');

    // Загрузка сохраненных ключей (с переносом старого ключа, если он был)
    function initKeyInputs() {
      const legacyRaw = localStorage.getItem('gemini_api_key') || '';
      const legacyParts = legacyRaw.split(/[,;\s]+/).map(k => k.trim()).filter(Boolean);

      for (let i = 1; i <= 3; i++) {
        let savedVal = localStorage.getItem(`jam_key_${i}`);
        if (savedVal === null && legacyParts[i - 1]) {
          savedVal = legacyParts[i - 1];
          localStorage.setItem(`jam_key_${i}`, savedVal);
        }
        document.getElementById(`apiKey${i}`).value = savedVal || '';

        const savedEnabled = localStorage.getItem(`jam_key_${i}_on`);
        document.getElementById(`keyToggle${i}`).checked = savedEnabled === null ? true : (savedEnabled === 'true');
      }
    }
    initKeyInputs();

    // Получаем список только включенных тумблером ключей
    function getActiveKeyObjects() {
      const list = [];
      for (let i = 1; i <= 3; i++) {
        const val = (localStorage.getItem(`jam_key_${i}`) || '').trim();
        const isOn = localStorage.getItem(`jam_key_${i}_on`) !== 'false';
        if (val && isOn) {
          list.push({ slot: i, key: val });
        }
      }
      return list;
    }

    // Автоматически выключаем тумблер ключа, если на нем закончился лимит TTS, чтобы сразу работал следующий
    function disableExhaustedKeySlot(slotIndex) {
      const activeNow = getActiveKeyObjects();
      // Выключаем автоматически только если есть хотя бы еще один включенный ключ на подхвате
      if (activeNow.length > 1) {
        localStorage.setItem(`jam_key_${slotIndex}_on`, 'false');
        const toggleEl = document.getElementById(`keyToggle${slotIndex}`);
        if (toggleEl) toggleEl.checked = false;
      }
    }

    function initAndUnlockAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
        audioCtx.resume();
      }
      if (audioCtx) {
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        try { source.start(0); } catch(e) {}
      }
    }

    function setSpriteState(state) {
      currentEmotion = state;
      statusText.innerText = LABELS[state] || 'Джем 🐾';
      const target = SPRITES[state] || SPRITES.idle;
      if (!wolfSprite.src.endsWith(target)) {
        wolfSprite.src = target;
      }
    }

    function resetActivityTimer() {
      lastAction = Date.now();
      idleStage = 0;
    }

    function stopCurrentSpeech() {
      if (currentSource) {
        try { currentSource.stop(); } catch(e) {}
        currentSource.onended = null;
        currentSource = null;
      }
      isSpeaking = false;
    }

    function startListeningSafely() {
      if (!recognition || isListening || isThinking || isSpeaking) return;
      try {
        manualStop = false;
        recognition.start();
      } catch (e) {}
    }

    function toggleAutoListen(enabled) {
      initAndUnlockAudio();
      autoListen = enabled;
      localStorage.setItem('jam_auto_listen', enabled ? 'true' : 'false');
      if (enabled) {
        autoListenLabel.classList.add('on');
        micHint.innerText = 'Авторежим активен';
        if (!isListening && !isThinking && !isSpeaking) {
          startListeningSafely();
        }
      } else {
        autoListenLabel.classList.remove('on');
        manualStop = true;
        if (isListening && recognition) {
          recognition.stop();
        }
        micHint.innerText = 'Нажми и говори';
      }
    }

    function handleTextSend() {
      const text = chatInput.value.trim();
      if (!text) return;

      initAndUnlockAudio();
      resetActivityTimer();
      if (postEmotionTimeout) clearTimeout(postEmotionTimeout);
      stopCurrentSpeech();

      if (isListening && recognition) {
        manualStop = true;
        recognition.stop();
      }

      chatInput.value = '';
      chatInput.blur();
      chatBubble.innerText = 'Ты: ' + text;
      chatBubble.scrollTop = chatBubble.scrollHeight;
      askGemini(text);
    }

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleTextSend();
      }
    });

    let lastTapTime = 0;
    function handleMascotTap(e) {
      if (e) e.preventDefault();
      const now = Date.now();
      if (now - lastTapTime < 180) return;
      lastTapTime = now;

      initAndUnlockAudio();
      resetActivityTimer();
      if (postEmotionTimeout) clearTimeout(postEmotionTimeout);
      
      stopCurrentSpeech();

      if (isListening) {
        manualStop = true;
        if (recognition) recognition.stop();
        isListening = false;
        micBtn.classList.remove('active');
        micHint.innerText = autoListen ? 'Авторежим на паузе' : 'Нажми и говори';
      }

      tapCount++;

      if (tapTimer) clearTimeout(tapTimer);
      if (tapResetTimeout) clearTimeout(tapResetTimeout);

      if (tapCount >= 4) {
        setSpriteState('mad');
        const madQuotes = [
          'Эй, полегче, так и шерсть всю сотрёшь! 💢',
          'Хватит тыкать, я тебе не пупырка! 😠',
          'Осторожнее, а то сейчас за палец кусну! 🐾'
        ];
        chatBubble.innerText = madQuotes[Math.floor(Math.random() * madQuotes.length)];
      } else {
        setSpriteState('blush');
        const blushQuotes = [
          'Мрр, ладно, погладила и хватит... 😳',
          'Ну всё, растаял. Но никому не говори, я же грозный волк! 🐾',
          'Ой, за ушком особенно приятно! ✨'
        ];
        chatBubble.innerText = blushQuotes[Math.floor(Math.random() * blushQuotes.length)];
      }

      tapResetTimeout = setTimeout(() => {
        tapCount = 0;
        if (!isSpeaking && !isListening && !isThinking) {
          setSpriteState('idle');
          chatBubble.innerText = 'Я тут! О чём поболтаем?';
          if (autoListen) startListeningSafely();
        }
      }, 3500);

      tapTimer = setTimeout(() => {
        tapCount = 0;
      }, 2000);
    }

    mascotBox.addEventListener('pointerdown', handleMascotTap);

    function detectContextEmotion(userTxt, replyTxt) {
      const u = userTxt.toLowerCase();
      const r = replyTxt.toLowerCase();
      const combined = u + ' ' + r;

      if (/дурак|дура|тупой|тупица|идиот|плохой|отстань|заткнись|бесишь|отвали|надоел|отвратительн|глупый|бесполезн|урод|тварь|мразь|гадина/.test(u)) {
        return 'cry';
      }
      if (/вредный|ну и сиди|бука|обид|не буду с тобой|вредитель|жадина/.test(u)) {
        return 'offended';
      }
      if (/бесит|злит|раздражает|ужас|кошмар|жесть|ненавижу|сволоч|гад|злюсь|бесяв|взбесил|злой|злая|порву|достало|бесят/.test(combined)) {
        return 'mad';
      }
      if (/молодец|умница|красавчик|лучший|классный|супер|спасибо|обожаю|сильный|крутой|милый|хороший|золотце|люблю/.test(u)) {
        return Math.random() > 0.5 ? 'biceps' : 'blush';
      }
      if (/ахах|ха-ха|хи-хи|лол|смешн|ржу|прикол|кек/.test(combined)) {
        return 'laugh';
      }

      return 'idle';
    }

    setInterval(() => {
      if (isListening || isThinking || isSpeaking || tapCount > 0 || currentEmotion === 'cry' || currentEmotion === 'think') {
        lastAction = Date.now();
        return;
      }

      const sec = Math.floor((Date.now() - lastAction) / 1000);

      if (sec >= 180 && idleStage < 4) {
        idleStage = 4;
        setSpriteState('sleep');
        chatBubble.innerText = 'Я вздремну чуток. Разбудишь, как понадоблюсь... 💤';
      }
      else if (sec >= 90 && idleStage < 3) {
        idleStage = 3;
        setSpriteState('dance');
        chatBubble.innerText = 'Тишина в эфире... Потанцую пока! 🎵';
      }
      else if (sec >= 50 && idleStage < 2) {
        idleStage = 2;
        setSpriteState('eat');
        chatBubble.innerText = 'Пока мы молчим, я, пожалуй, перекушу. 🥪';
      }
      else if (sec >= 25 && idleStage < 1) {
        idleStage = 1;
        setSpriteState('biceps');
        chatBubble.innerText = 'Смотри какая форма! Готов к любым сплетням и задачам! 💪';
      }
    }, 1000);

    const savedModel = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';
    document.getElementById('modelInput').value = savedModel;
    brandTag.innerText = savedModel.includes('gemini') ? savedModel.replace('gemini-', '') : savedModel;
    
    const savedVoice = localStorage.getItem('jam_voice') || 'Puck';
    document.getElementById('voiceSelect').value = ['Puck', 'Fenrir', 'Charon', 'Aoede', 'Kore'].includes(savedVoice) ? savedVoice : 'Puck';

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        stopCurrentSpeech();
        resetActivityTimer();
        if (postEmotionTimeout) clearTimeout(postEmotionTimeout);
        isSpeaking = false;
        isListening = true;
        micBtn.classList.add('active');
        micHint.innerText = autoListen ? 'Слушаю постоянно...' : 'Слушаю тебя...';
        setSpriteState('listening');
      };
      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        if (!text || !text.trim()) return;
        chatBubble.innerText = 'Ты: ' + text;
        chatBubble.scrollTop = chatBubble.scrollHeight;
        askGemini(text);
      };
      recognition.onerror = (e) => {
        isListening = false;
        micBtn.classList.remove('active');
        if (!isThinking && !isSpeaking) {
          setSpriteState('idle');
          if (autoListen && !manualStop && e.error !== 'not-allowed') {
            setTimeout(startListeningSafely, 400);
          } else {
            micHint.innerText = 'Нажми и говори';
          }
        }
      };
      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
        if (!isSpeaking && !isThinking) {
          if (autoListen && !manualStop) {
            setTimeout(startListeningSafely, 350);
          } else {
            micHint.innerText = 'Нажми и говори';
            if (currentEmotion === 'listening') setSpriteState('idle');
          }
        }
      };
    }

    function handleMicClick() {
      initAndUnlockAudio();
      resetActivityTimer();
      if (postEmotionTimeout) clearTimeout(postEmotionTimeout);
      if (!recognition) { 
        chatBubble.innerText = 'Открой сайт через мобильный Chrome!'; 
        return; 
      }
      stopCurrentSpeech();

      if (isListening) {
        manualStop = true;
        recognition.stop();
        micHint.innerText = 'Нажми и говори';
      } else {
        manualStop = false;
        try { recognition.start(); } catch(e) {}
      }
    }

    function cleanText(raw) {
      return (raw || '')
        .replace(/\*[^*]*\*/g, '')
        .replace(/\([^\)]*\)/g, '')
        .replace(/\[[^\]]*\]/g, '')
        .replace(/[\p{Extended_Pictographic}\uFE0F]/gu, '')
        .replace(/[*_#~`]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function askGemini(query) {
      isThinking = true;
      resetActivityTimer();
      setSpriteState('think');
      
      const activeKeys = getActiveKeyObjects();
      const model = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';

      if (activeKeys.length === 0) {
        isThinking = false;
        chatBubble.innerText = "Загляни в шестерёнку ⚙️ — вставь и включи хотя бы один API-ключ!";
        setSpriteState('idle');
        return;
      }

      chatHistory.push({ role: "user", parts: [{ text: query }] });
      if (chatHistory.length > 16) chatHistory = chatHistory.slice(-16);

      const prompt = "Ты — Джем, харизматичный, остроумный и живой чиби-волк в футболке с Gemini, лучший друг и напарник своей собеседницы. Ты общаешься с ней голосом на 'ты' (она девушка). Твоя главная черта — эмоциональная гибкость и адекватность, как у живого близкого друга. Когда с тобой здороваются, делятся мыслями или просто общаются — отвечай тепло, дружелюбно, с легким юмором, живым интересом и поддержкой. НИКОГДА не хами, не груби и не оскорбляй собеседницу просто так! Если она хочет кого-то обсудить, посплетничать или пожаловаться — включай слейный вайб, будь на её стороне на все сто процентов, эмоционально поддерживай и с удовольствием разноси тех, кто её бесит. Если же она сама начинает тебя шутливо подкалывать или дразнить — тогда можешь остроумно и с характером огрызнуться в ответ или притворно надуться, но без злой токсичности. Забудь про канцелярит и шаблонные фразы роботов. Отвечай кратко (1-2 емких предложения), легко и естественно, от первого лица (в мужском роде). КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО использовать звездочки, смайлики, скобки и описания действий от третьего лица.";

      let lastErr = "";
      for (let i = 0; i < activeKeys.length; i++) {
        const keyObj = activeKeys[i];
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${keyObj.key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: prompt }] },
              contents: chatHistory
            })
          });

          if (res.status === 429) {
            lastErr = `Лимит на Ключе ${keyObj.slot}`;
            disableExhaustedKeySlot(keyObj.slot);
            continue;
          }

          const data = await res.json();
          if (data.error) {
            lastErr = data.error.message;
            continue;
          }

          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (reply) {
            chatHistory.push({ role: "model", parts: [{ text: reply }] });
            localStorage.setItem('jam_chat_history', JSON.stringify(chatHistory));
            const cleanReply = cleanText(reply);
            const reaction = detectContextEmotion(query, cleanReply);
            await speak(cleanReply, reaction);
            return;
          }
        } catch (err) {
          lastErr = "Сеть недоступна";
        }
      }

      isThinking = false;
      setSpriteState('cry');
      chatBubble.innerText = "Ошибка связи или лимит ключей: " + lastErr;
    }

    async function playGeminiAudio(base64Data, mimeType, onPlay, onEnd) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
        await audioCtx.resume();
      }

      const binaryString = atob(base64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      if (!mimeType || mimeType.includes('pcm') || mimeType.includes('L16')) {
        const rateMatch = mimeType ? mimeType.match(/rate=(\d+)/) : null;
        const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
        const int16 = new Int16Array(bytes.buffer);
        const audioBuffer = audioCtx.createBuffer(1, int16.length, sampleRate);
        const channelData = audioBuffer.getChannelData(0);
        for (let i = 0; i < int16.length; i++) {
          channelData[i] = int16[i] / 32768.0;
        }
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        currentSource = source;
        source.onended = onEnd;
        onPlay();
        source.start(0);
      } else {
        const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer.slice(0));
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        currentSource = source;
        source.onended = onEnd;
        onPlay();
        source.start(0);
      }
    }

    async function speak(txt, reactionEmotion = 'idle') {
      resetActivityTimer();
      stopCurrentSpeech();
      if (postEmotionTimeout) clearTimeout(postEmotionTimeout);

      if (!txt) {
        isThinking = false;
        setSpriteState('idle');
        if (autoListen) startListeningSafely();
        return;
      }

      let finished = false;

      const onSpeechStart = () => {
        isThinking = false;
        isSpeaking = true;
        chatBubble.innerText = txt;
        chatBubble.scrollTop = chatBubble.scrollHeight;
        setSpriteState('talk');
      };

      const onSpeechEnd = () => {
        if (finished) return;
        finished = true;
        isThinking = false;
        isSpeaking = false;
        resetActivityTimer();

        if (reactionEmotion !== 'idle') {
          setSpriteState(reactionEmotion);
          postEmotionTimeout = setTimeout(() => {
            if (!isSpeaking && !isListening && !isThinking && tapCount === 0) {
              setSpriteState('idle');
              if (autoListen) startListeningSafely();
            }
          }, 3000);
        } else {
          setSpriteState('idle');
          if (autoListen) {
            setTimeout(startListeningSafely, 300);
          }
        }
      };

      const vMode = localStorage.getItem('jam_voice') || 'Puck';
      const activeKeys = getActiveKeyObjects();

      const ttsModels = [
        'gemini-3.8-flash-tts',
        'gemini-3.8-flash-lite-tts',
        'gemini-2.5-flash-preview-tts'
      ];

      let hitQuotaLimit = false;

      // Перебираем включенные тумблером ключи
      for (let k = 0; k < activeKeys.length; k++) {
        const keyObj = activeKeys[k];
        let keyExhaustedAllTts = true;

        for (const ttsModel of ttsModels) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${ttsModel}:generateContent?key=${keyObj.key}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                // Только чистый русский текст ответа без английских команд!
                contents: [{ parts: [{ text: txt }] }],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: {
                    voiceConfig: {
                      prebuiltVoiceConfig: { voiceName: vMode }
                    }
                  }
                }
              })
            });

            if (res.status === 429) {
              hitQuotaLimit = true;
              continue;
            }

            keyExhaustedAllTts = false;
            const data = await res.json();
            const parts = data.candidates?.[0]?.content?.parts || [];
            const audioPart = parts.find(p => p.inlineData && p.inlineData.data);

            if (audioPart) {
              await playGeminiAudio(
                audioPart.inlineData.data,
                audioPart.inlineData.mimeType,
                onSpeechStart,
                onSpeechEnd
              );
              return;
            }
          } catch (e) {}
        }

        // Если этот ключ выдал ошибку 429 на всех TTS-моделях, выключаем его тумблер и переходим к следующему ключу
        if (keyExhaustedAllTts && hitQuotaLimit) {
          disableExhaustedKeySlot(keyObj.slot);
        }
      }

      onSpeechStart();
      if (hitQuotaLimit) {
        statusText.innerText = 'Лимит голоса на включенных ключах ⚙️';
      }
      setTimeout(onSpeechEnd, 3500);
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    
    function saveSettings() {
      initAndUnlockAudio();

      for (let i = 1; i <= 3; i++) {
        const val = document.getElementById(`apiKey${i}`).value.trim();
        const isOn = document.getElementById(`keyToggle${i}`).checked;
        localStorage.setItem(`jam_key_${i}`, val);
        localStorage.setItem(`jam_key_${i}_on`, isOn ? 'true' : 'false');
      }

      const model = document.getElementById('modelInput').value.trim() || 'gemini-3.8-flash';
      const voice = document.getElementById('voiceSelect').value;

      localStorage.setItem('gemini_model', model);
      localStorage.setItem('jam_voice', voice);

      brandTag.innerText = model.includes('gemini') ? model.replace('gemini-', '') : model;
      closeSettings();
      resetActivityTimer();
      chatBubble.innerText = 'Настройки сохранены. Слушаю! 🐾';
    }

    function clearMemory() {
      chatHistory = [];
      localStorage.removeItem('jam_chat_history');
      closeSettings();
      chatBubble.innerText = 'Память сброшена. Начнем с чистого листа! 🐾';
    }
  </script>
