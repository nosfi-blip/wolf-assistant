<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Джем</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141b28;
      --accent: #7aa2f7;
      --accent-glow: rgba(122, 162, 247, 0.45);
      --text: #c0caf5;
      --text-dim: #7982a9;
      --border: #222c3f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background-image: radial-gradient(circle at 50% 25%, #182338 0%, #0b0f19 80%); }
    header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(20, 27, 40, 0.9); backdrop-filter: blur(10px); z-index: 10; }
    .brand { font-weight: 800; font-size: 1.15rem; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand-tag { font-size: 0.65rem; background: linear-gradient(135deg, #bb9af7, #7aa2f7); color: #0b0f19; padding: 2px 7px; border-radius: 10px; font-weight: 800; }
    .icon-btn { background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; }
    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; position: relative; }
    
    .mascot-box { width: 260px; height: 320px; position: relative; display: flex; justify-content: center; align-items: center; }
    .wolf-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.65)); transition: all 0.3s ease; }
    
    /* Состояния персонажа */
    .idle .wolf-img { animation: breathe 3.5s ease-in-out infinite alternate; }
    .listening .wolf-img { transform: scale(1.03) rotate(-3deg); filter: drop-shadow(0 0 20px var(--accent-glow)); }
    .thinking .wolf-img { animation: think 1s ease-in-out infinite alternate; }
    .speaking .wolf-img { animation: speak 0.25s ease-in-out infinite alternate; }
    .eating .wolf-img { animation: chew 0.35s ease-in-out infinite alternate; }
    .dancing .wolf-img { animation: dance 0.45s ease-in-out infinite alternate; }
    .sleeping .wolf-img { transform: translateY(10px) scale(0.95); filter: brightness(0.7) drop-shadow(0 8px 16px rgba(0,0,0,0.5)); }
    .angry .wolf-img { animation: shake 0.12s infinite alternate; filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.7)); }
    .sad .wolf-img { transform: translateY(8px) scale(0.97); filter: grayscale(0.3); }
    .blushing .wolf-img { transform: scale(1.02); filter: drop-shadow(0 0 16px rgba(251, 113, 133, 0.6)); }

    @keyframes breathe { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
    @keyframes think { 0% { transform: rotate(-3deg); } 100% { transform: rotate(3deg); } }
    @keyframes speak { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-5px) scale(1.03); } }
    @keyframes chew { 0% { transform: translateY(0) rotate(-2deg); } 100% { transform: translateY(-4px) rotate(2deg); } }
    @keyframes dance { 0% { transform: rotate(-8deg) translateY(-8px); } 100% { transform: rotate(8deg) translateY(0); } }
    @keyframes shake { 0% { transform: translateX(-3px); } 100% { transform: translateX(3px); } }

    /* Оверлейные значки действий */
    .badge-fx { position: absolute; font-size: 42px; display: none; z-index: 5; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5)); }
    .eating #fx-sandwich { display: block; bottom: 35%; animation: chew 0.35s infinite alternate; }
    .sleeping #fx-zzz { display: block; top: 10%; right: 10%; font-size: 32px; font-weight: 900; color: #7aa2f7; animation: breathe 1.5s infinite alternate; }
    .dancing #fx-notes { display: block; top: 12%; left: 8%; animation: breathe 0.6s infinite alternate; }
    .angry #fx-anger { display: block; top: 12%; right: 12%; }
    .sad #fx-tear { display: block; top: 28%; right: 28%; font-size: 26px; }

    .status-text { font-size: 0.85rem; color: var(--accent); margin-top: 10px; height: 18px; font-weight: 700; text-transform: uppercase; text-align: center; }
    .chat-bubble { margin-top: 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px 18px; max-width: 90%; min-height: 50px; max-height: 140px; overflow-y: auto; font-size: 0.95rem; line-height: 1.4; text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); }

    .controls { padding: 16px; display: flex; flex-direction: column; align-items: center; background: rgba(20, 27, 40, 0.9); border-top: 1px solid var(--border); backdrop-filter: blur(10px); gap: 10px; }
    .mic-button { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #7aa2f7, #6088ff); border: none; color: #0b0f19; font-size: 1.85rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 20px var(--accent-glow); transition: all 0.25s; }
    .mic-button.active { background: linear-gradient(135deg, #f7768e, #ff4065); transform: scale(1.1); box-shadow: 0 0 25px rgba(247, 118, 142, 0.8); }
    .mic-hint { font-size: 0.8rem; color: var(--text-dim); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 1.2rem; margin-bottom: 14px; color: #fff; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px 12px; background: #0b0f19; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 0.85rem; outline: none; }
    .btn { width: 100%; padding: 11px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; margin-top: 8px; }
    .btn-save { background: var(--accent); color: #0b0f19; }
    .btn-close { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Джем</span>
      <span class="brand-tag" id="brandTag">Gemini</span>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </header>

  <main class="stage">
    <div class="mascot-box idle" id="mascotBox">
      <!-- Настоящий пушистый арт чиби-волчонка -->
      <img class="wolf-img" id="wolfImg" src="https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=2,quality=85,width=600/inputs/input_1730409890.png" alt="Джем" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=jam'">
      
      <!-- Спецэффекты состояний -->
      <div class="badge-fx" id="fx-sandwich">🥪</div>
      <div class="badge-fx" id="fx-zzz">Zzz...</div>
      <div class="badge-fx" id="fx-notes">🎵✨</div>
      <div class="badge-fx" id="fx-anger">💢</div>
      <div class="badge-fx" id="fx-tear">💧</div>
    </div>

    <div class="status-text" id="statusText">Привет! Я Джем 🐾</div>
    <div class="chat-bubble" id="chatBubble">Нажми на микрофон, чтобы поговорить!</div>
  </main>

  <footer class="controls">
    <button class="mic-button" id="micBtn" onclick="handleMicClick()">🎤</button>
    <div class="mic-hint" id="micHint">Нажми и говори</div>
  </footer>

  <!-- Окно настроек -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Настройки Джема</h2>

      <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="apiKeyInput" class="form-control" placeholder="Вставьте ваш API-ключ">
      </div>

      <div class="form-group">
        <label>Модель Gemini (меняйте прямо тут без правок кода!):</label>
        <input type="text" id="modelInput" class="form-control" value="gemini-3.8-flash">
      </div>

      <div class="form-group">
        <label>Голос озвучки:</label>
        <select id="voiceSelect" class="form-control">
          <option value="neural_female">Онлайн: Светлана (Нейросеть, мягкий)</option>
          <option value="neural_male">Онлайн: Дмитрий (Нейросеть, живой)</option>
          <option value="system">Системный синтезатор телефона</option>
        </select>
      </div>

      <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
      <button class="btn btn-close" onclick="closeSettings()">Закрыть</button>
    </div>
  </div>

  <script>
    let isListening = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let audioPlayer = new Audio();
    
    let lastAction = Date.now();
    let currentEmotion = 'idle';

    const mascotBox = document.getElementById('mascotBox');
    const statusText = document.getElementById('statusText');
    const chatBubble = document.getElementById('chatBubble');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const brandTag = document.getElementById('brandTag');

    const labels = {
      idle: 'Привет! Я Джем 🐾',
      listening: 'Джем слушает ушком 🐾',
      thinking: 'Джем соображает...',
      speaking: 'Джем говорит...',
      angry: 'Джем сердится! 💢',
      sad: 'Джем грустит 😢',
      blushing: 'Джем смущается 😳',
      eating: 'Джем жуёт сэндвич 🥪',
      dancing: 'Джем танцует ✨🐾',
      sleeping: 'Джем сладко спит... 💤'
    };

    function resetActivity() {
      lastAction = Date.now();
      if (!['speaking', 'listening', 'thinking'].includes(currentEmotion)) {
        setEmotion('idle');
      }
    }

    // Железный таймер скуки
    setInterval(() => {
      if (isListening || (synth && synth.speaking) || !audioPlayer.paused || ['thinking', 'speaking', 'listening'].includes(currentEmotion)) {
        lastAction = Date.now();
        return;
      }
      const sec = Math.floor((Date.now() - lastAction) / 1000);
      if (sec >= 70 && currentEmotion !== 'sleeping') {
        setEmotion('sleeping');
        chatBubble.innerText = 'Снится сахарная косточка...';
      } else if (sec >= 45 && sec < 70 && currentEmotion !== 'dancing') {
        setEmotion('dancing');
        chatBubble.innerText = 'Лапками топ-топ! Танцуем!';
      } else if (sec >= 25 && sec < 45 && currentEmotion !== 'eating') {
        setEmotion('eating');
        chatBubble.innerText = 'Хрум-хрум! Вкусный сэндвич!';
      } else if (sec >= 12 && sec < 25 && currentEmotion === 'idle') {
        statusText.innerText = 'Джем скучает...';
      }
    }, 1000);

    function setEmotion(name) {
      currentEmotion = name;
      mascotBox.className = 'mascot-box ' + name;
      statusText.innerText = labels[name] || 'Джем 🐾';
    }

    function detectEmotion(txt) {
      const l = txt.toLowerCase();
      if (/зл(ю|и|е)|бес(и|ит)|фу|отстань|хватит|ужас/.test(l)) return 'angry';
      if (/груст|обид|жаль|печал|эх|плач|слез/.test(l)) return 'sad';
      if (/смущ|красне|ой|мило|приятно/.test(l)) return 'blushing';
      return 'idle';
    }

    // Настройки
    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    const savedModel = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';
    document.getElementById('modelInput').value = savedModel;
    brandTag.innerText = savedModel.replace('gemini-', '');
    document.getElementById('voiceSelect').value = localStorage.getItem('jam_voice') || 'neural_female';

    // Микрофон
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        resetActivity();
        isListening = true;
        micBtn.classList.add('active');
        micHint.innerText = 'Слушаю тебя...';
        setEmotion('listening');
      };
      recognition.onresult = (e) => {
        resetActivity();
        const text = e.results[0][0].transcript;
        chatBubble.innerText = 'Ты: ' + text;
        askGemini(text);
      };
      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('active');
        setEmotion('idle');
        micHint.innerText = 'Нажми и говори';
      };
      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
      };
    }

    function handleMicClick() {
      resetActivity();
      if (!recognition) { alert('Открой через мобильный Chrome!'); return; }
      if (synth && synth.speaking) synth.cancel();
      if (!audioPlayer.paused) { audioPlayer.pause(); audioPlayer.currentTime = 0; }
      if (isListening) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch(e){}
      }
    }

    function cleanText(raw) {
      return (raw || '')
        .replace(/\*[^*]*\*/g, '')
        .replace(/\([^\)]*\)/g, '')
        .replace(/\[[^\]]*\]/g, '')
        .replace(/[\p{Extended_Pictographic}\uFE0F]/gu, '')
        .replace(/[*_#~`]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function askGemini(query) {
      resetActivity();
      setEmotion('thinking');
      const apiKey = localStorage.getItem('gemini_api_key');
      const model = localStorage.getItem('gemini_model') || 'gemini-3.8-flash';

      if (!apiKey) {
        speak("Я тебя слышу! Но чтобы я начал отвечать, вставь свой API-ключ в шестерёнку наверху!");
        return;
      }

      try {
        const prompt = "Ты — Джем, маленький чиби-волчонок в черной футболке с логотипом Gemini. Ты общаешься только голосом! КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО использовать звездочки, скобки, смайлы и описывать свои действия. Говори кратко (1-2 законченных предложения) от 1-го лица.";
        
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: `${prompt}\n\nПользователь сказал: "${query}". Твой ответ:` }] }]
          })
        });

        const data = await res.json();
        if (data.error) {
          speak("Ошибка Gemini: " + (data.error.message || "проверь ключ или модель в настройках"));
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          const finalTxt = cleanText(reply);
          const emo = detectEmotion(reply);
          speak(finalTxt || reply, emo);
        } else {
          speak("Не удалось получить ответ.");
        }
      } catch (err) {
        speak("Не могу связаться с Gemini. Проверь сеть или VPN!");
      }
    }

    function speak(text, emotion = 'idle') {
      resetActivity();
      const txt = cleanText(text);
      chatBubble.innerText = txt;
      setEmotion('speaking');

      const vMode = localStorage.getItem('jam_voice') || 'neural_female';
      const onEnd = () => {
        setEmotion(emotion);
        resetActivity();
      };

      if (vMode.startsWith('neural')) {
        const vName = vMode === 'neural_female' ? 'ru-RU-SvetlanaNeural' : 'ru-RU-DmitryNeural';
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.src = `https://api.streamelements.com/kappa/v2/speech?voice=${vName}&text=${encodeURIComponent(txt)}`;
        audioPlayer.onended = onEnd;
        audioPlayer.onerror = () => fallbackSpeak(txt, onEnd);
        audioPlayer.play().catch(() => fallbackSpeak(txt, onEnd));
      } else {
        fallbackSpeak(txt, onEnd);
      }
    }

    function fallbackSpeak(txt, cb) {
      if (!synth) { if(cb) cb(); return; }
      synth.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ru-RU';
      u.onend = () => { if(cb) cb(); };
      u.onerror = () => { if(cb) cb(); };
      synth.speak(u);
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    
    function saveSettings() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const model = document.getElementById('modelInput').value.trim() || 'gemini-3.8-flash';
      const voice = document.getElementById('voiceSelect').value;

      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('gemini_model', model);
      localStorage.setItem('jam_voice', voice);

      brandTag.innerText = model.replace('gemini-', '');
      closeSettings();
      resetActivity();
      chatBubble.innerText = 'Настройки сохранены! ✨';
    }
  </script>
</body>
</html>
